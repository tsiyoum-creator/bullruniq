<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — BullrunIQ</title>
<meta name="description" content="Get in touch with the BullrunIQ team.">
<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://bullruniq.com/contact">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505' stroke='%23c9a84c' stroke-opacity='0.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c9a84c'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#c9a84c;--gold-light:#e8c96d;--bg:#050505;--surface:#111;--border:#1a1a1a;--t:#f0ece4;--t2:#8a8278;--t3:#3d3a35}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--t);line-height:1.8;font-weight:300}
.wrap{max-width:560px;margin:0 auto;padding:80px 24px 120px}
.brand{font-family:"Cormorant Garamond",serif;font-size:20px;letter-spacing:2px;margin-bottom:48px;display:inline-block;color:var(--t)}
.brand span{color:var(--gold)}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,5vw,52px);font-weight:300;margin-bottom:12px}
.sub{font-size:15px;color:var(--t2);margin-bottom:40px}
label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);margin:18px 0 8px}
input,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--t);font-family:"DM Sans",sans-serif;font-size:15px;padding:14px 16px;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:140px;resize:vertical}
button{margin-top:28px;width:100%;background:var(--gold);border:none;border-radius:4px;color:#000;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:16px;cursor:pointer;transition:background .2s}
button:hover{background:var(--gold-light)}
button:disabled{opacity:.6;cursor:not-allowed}
.hp{position:absolute;left:-9999px}
.note{font-size:12px;color:var(--t3);margin-top:16px}
.ok{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--gold);padding:24px 0}
a{color:var(--gold);text-decoration:none}
.back{display:inline-block;margin-top:48px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t2);border:1px solid #2a2a2a;border-radius:4px;padding:12px 28px}
.back:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">Bullrun<span>IQ</span></a>
  <h1>Get in touch</h1>
  <p class="sub">Questions, feedback, partnerships, or press — we read everything.</p>

  <form id="cForm" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/contact?sent=1">
    <input type="hidden" name="form-name" value="contact">
    <p class="hp"><label>Leave empty <input name="bot-field"></label></p>
    <label for="cName">Name</label>
    <input id="cName" type="text" name="name" autocomplete="name" required>
    <label for="cEmail">Email</label>
    <input id="cEmail" type="email" name="email" autocomplete="email" required>
    <label for="cMsg">Message</label>
    <textarea id="cMsg" name="message" required></textarea>
    <button id="cSubmit" type="submit">Send Message</button>
    <p class="note" id="cNote">We typically reply within a couple of business days.</p>
  </form>

  <a class="back" href="/">← Back to BullrunIQ</a>
</div>
<script>
var f=document.getElementById('cForm');
function enc(d){return Object.keys(d).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(d[k]);}).join('&');}
f.addEventListener('submit',function(e){
  e.preventDefault();
  var btn=document.getElementById('cSubmit');btn.disabled=true;btn.textContent='Sending…';
  fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:enc({
    'form-name':'contact',
    name:document.getElementById('cName').value.trim(),
    email:document.getElementById('cEmail').value.trim(),
    message:document.getElementById('cMsg').value.trim()
  })}).then(function(){
    f.innerHTML='<div class="ok">Message sent. ✦ We\'ll be in touch.</div>';
  }).catch(function(){
    btn.disabled=false;btn.textContent='Send Message';
    document.getElementById('cNote').textContent='Something went wrong — please try again.';
  });
});
</script>
</body>
</html>
