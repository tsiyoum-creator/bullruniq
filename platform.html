function agCard(def,ar){
  var html='<div class="ag" style="border-top:2px solid '+def.color+'">';
  html+='<div class="ag-hdr"><div class="ag-ico" style="background:'+def.color+'22;color:'+def.color+'">'+def.name.slice(0,2)+'</div>';
  html+='<div><div class="ag-name" style="color:'+def.color+'">'+def.name+'</div><div class="ag-role">'+def.role+'</div></div></div>';
  if(ar.loading){
    html+='<div class="ld"><span class="spinning" style="color:'+def.color+'">◎</span> Analyzing next 72 hours...</div>';
  } else if(ar.error){
    html+='<div style="color:var(--red);font-size:11px;padding:8px 0;word-break:break-word">'+ar.error+'</div>';
  } else if(ar.data){
    var d=ar.data;
    var vc=d.verdict==='BUY'||d.verdict==='ADD'?'var(--grn)':d.verdict==='SELL'||d.verdict==='TRIM'?'var(--red)':'var(--gold)';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    html+='<span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;background:'+vc+'22;border:1px solid '+vc+'55;color:'+vc+'">'+d.verdict+'</span>';
    if(d.stance)html+='<span style="font-size:10px;color:var(--t3)">'+d.stance+'</span>';
    if(d.thesisVerdict){var tc2=d.thesisVerdict==='CONFIRMED'?'var(--grn)':d.thesisVerdict==='INVALIDATED'?'var(--red)':'var(--gold)';html+='<span style="font-size:9px;font-weight:600;color:'+tc2+'">'+d.thesisVerdict+'</span>';}
    html+='</div>';
    html+='<div class="conf-row"><span>Confidence</span><span>'+d.confidence+'% · '+d.riskLevel+' risk</span></div>';
    html+='<div class="cbar"><div class="cfill" style="width:'+d.confidence+'%;background:'+def.color+'"></div></div>';
    if(d.topAsset)html+='<div style="font-size:10px;color:var(--t3);margin-bottom:6px">Focus: <strong style="color:'+def.color+'">'+d.topAsset+'</strong></div>';
    html+='<div class="ag-take">'+d.shortTake+'</div>';
    // Entry/Stop/Target row
    if(d.entry||d.stopLoss||d.takeProfit){
      html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:8px 0">';
      if(d.entry)html+='<div style="background:var(--s2);border:1px solid var(--b2);border-radius:5px;padding:5px 7px"><div style="font-size:8px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px">Entry</div><div style="font-size:10px;font-weight:600;font-family:DM Mono,monospace;color:var(--grn)">'+d.entry+'</div></div>';
      if(d.stopLoss)html+='<div style="background:var(--s2);border:1px solid var(--r2);border-radius:5px;padding:5px 7px"><div style="font-size:8px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px">Stop</div><div style="font-size:10px;font-weight:600;font-family:DM Mono,monospace;color:var(--red)">'+d.stopLoss+'</div></div>';
      if(d.takeProfit)html+='<div style="background:var(--s2);border:1px solid rgba(200,241,53,0.2);border-radius:5px;padding:5px 7px"><div style="font-size:8px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px">72h Target</div><div style="font-size:10px;font-weight:600;font-family:DM Mono,monospace;color:var(--lime)">'+d.takeProfit+'</div></div>';
      html+='</div>';
      if(d.riskReward)html+='<div style="font-size:10px;color:var(--t3);margin-bottom:6px">R:R <strong style="color:'+def.color+'">'+d.riskReward+'</strong></div>';
    }
    // Signals
    if(d.signals&&d.signals.length){html+='<div class="sig-list">'+d.signals.map(function(s){return'<div class="sig">'+s+'</div>';}).join('')+'</div>';}
    // Cycle / analog specific fields
    if(d.historicalAnalog)html+='<div style="margin-top:6px;font-size:10px;color:var(--gold)">'+d.historicalAnalog+'</div>';
    if(d.analogDate)html+='<div style="font-size:10px;color:var(--blue)">Analog: '+d.analogDate+(d.analogBTCPrice?' @ $'+d.analogBTCPrice:'')+'</div>';
    if(d.divergences&&d.divergences.length)html+='<div style="margin-top:4px;font-size:10px;color:var(--t3)">'+d.divergences.slice(0,1).join('')+'</div>';
    if(d.cyclePhase)html+='<div style="font-size:10px;color:var(--t3)">Phase: <strong style="color:var(--gold)">'+d.cyclePhase.replace(/_/g,' ')+'</strong></div>';
    if(d.cycleRead)html+='<div style="margin-top:4px;font-size:10px;color:var(--t3)">'+d.cycleRead+'</div>';
    if(d.analogRead)html+='<div style="font-size:10px;color:var(--t3)">'+d.analogRead+'</div>';
    // Biggest risk
    if(d.biggestRisk)html+='<div style="margin-top:7px;font-size:10px;padding:5px 8px;background:var(--r8);border-radius:5px;border:1px solid var(--r2);color:var(--t2)"><span style="color:var(--red);font-weight:600">Risk: </span>'+d.biggestRisk+'</div>';
    // Top move (TACTICAL only)
    if(d.topMove)html+='<div style="margin-top:7px;font-size:10px;padding:5px 8px;background:rgba(200,241,53,0.05);border-radius:5px;border:1px solid rgba(200,241,53,0.2);color:var(--lime)"><strong></strong>'+d.topMove+'</div>';
  } else {
    html+='<div style="color:var(--t3);font-size:11px;padding:8px 0">Waiting...</div>';
  }
  return html+'</div>';
}

    });
  }
  // Accumulate (flat keys a1-a3)
  var accs=[];

  if(accs.length){
    html+='<div class="sh blue">Accumulate These</div>';
    accs.forEach(function(a){

    });
  }
  // Avoid (flat keys x1-x2)
  var avoids=[];
  for(var i=1;i<=2;i++){if(d['x'+i])avoids.push({ticker:d['x'+i],reason:d['x'+i+'r']||''});}
  if(avoids.length){
    html+='<div class="sh red">Avoid These</div>';
    avoids.forEach(function(a){
      html+='<div class="lt-card rl"><div class="lt-top"><span class="lt-tick" style="color:var(--red)">'+a.ticker+'</span></div><div class="lt-reason">'+a.reason+'</div></div>';
    });
  }
  return html;
}

async function aiSmartImport(){
  // AI works out of the box via the secure server proxy (BYOK optional in Settings).
  var raw=document.getElementById('smartPaste').value.trim();
  if(!raw){alert('Paste your portfolio data first.');return;}
  var btn=document.getElementById('smartBtn');
  var res=document.getElementById('smartRes');
  btn.textContent='Parsing...';btn.disabled=true;
  res.style.display='none';
  try{
    var sys='You are a financial data parser. Extract investment holdings from ANY format — CSV, text, table paste, screenshot text, brokerage export. Return ONLY a JSON array of holdings. Each holding: {"name":"Full Asset Name","ticker":"TICKER","qty":number,"avg":number,"type":"crypto|stock"}. Ticker must be the standard symbol (BTC, ETH, AAPL, etc). avg is the average cost per unit/share. If avg is unknown use 0. Ignore cash, uninvested balance, pending orders. Return ONLY the JSON array, no other text.';
    var text=await claudeJSON(sys,'Parse these holdings into JSON:\n\n'+raw,800,MODEL_FAST);
    var arr=JSON.parse(text.replace(/```json|```/g,'').trim().match(/\[[\s\S]*\]/)[0]);
    if(!Array.isArray(arr)||!arr.length)throw new Error('No holdings found');
    exitDemoIfActive();
    var added=0;
    arr.forEach(function(h){
      if(!h.ticker||!h.qty)return;
      var holding={id:Date.now()+Math.random(),name:h.name||h.ticker,ticker:h.ticker.toUpperCase(),qty:+h.qty,avg:+h.avg||0};
      if(h.type==='crypto'||CGMAP[h.ticker.toUpperCase()])port.crypto.push(holding);
      else port.stocks.push(holding);
      added++;
    });
    savePort();refreshAll();
    res.style.display='block';res.style.color='var(--grn)';
    res.textContent='✓ Imported '+added+' holdings successfully! Check your Portfolio tab.';
    document.getElementById('smartPaste').value='';
  }catch(e){
    res.style.display='block';res.style.color='var(--red)';
    res.textContent='✕ Parse failed: '+e.message+'. Try copying cleaner data from your broker.';
  }
  btn.textContent='Parse & Import';btn.disabled=false;
}

function executeChatAction(a){
  try{
    if(a.type==='ADD_CRYPTO'){
      exitDemoIfActive();
      var t=a.ticker.toUpperCase();
      var existing=port.crypto.find(function(x){return x.ticker.toUpperCase()===t;});
      if(existing){existing.qty=parseFloat((existing.qty+(+a.qty||0)).toFixed(8));if(a.avg)existing.avg=+a.avg;}
      else{port.crypto.push({id:Date.now()+Math.random(),name:a.name||t,ticker:t,qty:+a.qty||0,avg:+a.avg||0});}
      savePort();fetchCrypto(true);return 'Added '+a.qty+' '+t;
    }
    if(a.type==='ADD_STOCK'){
      exitDemoIfActive();
      var t=a.ticker.toUpperCase();
      var existing=port.stocks.find(function(x){return x.ticker.toUpperCase()===t;});
      if(existing){existing.qty=parseFloat((existing.qty+(+a.qty||0)).toFixed(4));if(a.avg)existing.avg=+a.avg;}
      else{port.stocks.push({id:Date.now()+Math.random(),name:a.name||t,ticker:t,qty:+a.qty||0,avg:+a.avg||0});}
      savePort();return 'Added '+a.qty+' '+t;
    }
    if(a.type==='REMOVE_HOLDING'){
      var t=a.ticker.toUpperCase();
      port.crypto=port.crypto.filter(function(x){return x.ticker.toUpperCase()!==t;});
      port.stocks=port.stocks.filter(function(x){return x.ticker.toUpperCase()!==t;});
      savePort();return 'Removed '+t;
    }
    if(a.type==='RUN_COUNCIL'){setTimeout(function(){go('council',null);setTimeout(runCouncil,400);},600);return 'Launching council';}
  }catch(e){console.error('Chat action error:',e);}
  return null;
}

async function sendChat(){
  if(chatSending)return;
  var inp=document.getElementById('chatInput');
  if(!inp)return;
  var text=inp.value.trim();
  if(!text)return;
  if(!gateAI('AI chat'))return;

  inp.value='';inp.style.height='44px';
  chatSending=true;

  var id=chatState.agent;
  if(!chatState.history[id])chatState.history[id]=[];
  var hist=chatState.history[id];

  // Add user message immediately
  hist.push({role:'user',content:text});
  saveChat();
  chatUpdateMsgs();

  try{
    // Build Claude messages from history (last 20 turns), add format nudge to latest
    var msgs=hist.slice(-20).map(function(m,i,arr){
      if(m.role==='user'&&i===arr.length-1){
        return{role:'user',content:m.content+'\n\n[Output ONLY the JSON format from your system prompt — no text outside the JSON.]'};
      }
      return{role:m.role,content:m.content};
    });

    var r=await anthropicCall({model:MODEL_SMART,max_tokens:700,system:buildAgentSys(id),messages:msgs});
    var raw=await r.text();
    if(!r.ok){var e2=raw.slice(0,300);try{var ej=JSON.parse(raw);e2=(ej.error&&ej.error.message)||e2;}catch(x){}throw new Error('HTTP '+r.status+': '+e2);}

    var resp=JSON.parse(raw).content[0].text.trim();
    var agentMsg=resp;
    var actions=[];
    try{
      var jm=resp.match(/\{[\s\S]*\}/);
      if(jm){var parsed=JSON.parse(jm[0]);agentMsg=parsed.msg||parsed.message||resp;actions=Array.isArray(parsed.actions)?parsed.actions:[];}
    }catch(x){agentMsg=resp;}

    // Execute actions
    actions.forEach(function(a){executeChatAction(a);});

    hist.push({role:'assistant',content:agentMsg});
    chatState.history[id]=hist.slice(-60);
    saveChat();

  }catch(e){
    hist.push({role:'assistant',content:'Something went wrong: '+e.message+'. If this keeps happening, the server AI may be busy — try again in a moment.'});
    chatState.history[id]=hist;
    saveChat();
  }

  chatSending=false;
  chatUpdateMsgs();
}

  html+='<button class="btn btn-g" onclick="joinWaitlist(\'Pro\')" style="white-space:nowrap">Join Waitlist →</button>';
  html+='</div>';
  html+='<div id="waitlistRes" style="margin-top:8px;font-size:10px;color:var(--grn);display:none">✓ You\'re on the list! We\'ll reach out when Pro launches.</div>';
  html+='</div>';

  return html;
}

function _encodeForm(d){return Object.keys(d).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(d[k]);}).join('&');}
async function joinWaitlist(tier){
  var emEl=document.getElementById('waitlistEmail');
  var email=emEl?emEl.value.trim():'';
  var res=document.getElementById('waitlistRes');
  var tkey=String(tier).toLowerCase();
  track('upgrade_click',{tier:tkey});
  // 1) Try real Stripe checkout
  try{
    var r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tier:tkey,email:email})});
    var d=await r.json();
    if(d&&d.configured&&d.url){track('checkout_start',{tier:tkey});location.href=d.url;return;}
  }catch(e){}
  // 2) Stripe not live yet → capture as a founding-member lead
  if(!email||email.indexOf('@')<1){
    if(res){res.style.display='block';res.style.color='var(--gold)';res.textContent='Enter your email above, then tap Get '+tier+' — we\'ll reserve your founding spot.';}
    if(emEl)emEl.focus();
    return;
  }
  try{
    await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:_encodeForm({'form-name':'tier-signup',email:email,tier:tkey})});
  }catch(e){}
  track('waitlist_signup',{tier:tkey,source:'pro-tab'});
  if(res){res.style.display='block';res.style.color='var(--grn)';res.textContent='✓ You\'re on the '+tier+' early-access list! We\'ll reach out the moment it opens.';}
}

// ── Analytics (privacy-friendly first-party beacon) ───────────
function track(ev,meta){
  try{
    var body=JSON.stringify({ev:ev,path:location.pathname,ref:document.referrer,meta:meta||null});
    if(navigator.sendBeacon)navigator.sendBeacon('/api/track',body);
    else fetch('/api/track',{method:'POST',body:body,keepalive:true});
  }catch(e){}
}

// ── Init ──────────────────────────────────────────────────────
load();
// First visit → show the demo portfolio so the app is never empty.
// It stays until the visitor adds/imports real holdings (auto-clears) or
// dismisses it ('briq-demo-off'). Signed-in cloud data always replaces it.
try{
  if(!all().length&&localStorage.getItem('briq-demo-off')!=='1'){
    port=JSON.parse(JSON.stringify(DEMO_PORT));
    localStorage.setItem(DEMOK,'1');
    localStorage.setItem(SK,JSON.stringify(port));
  }
}catch(e){}
track('pageview');
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/sw.js');}catch(e){}}
if(auth.token)pullSync(); // logged in → adopt cloud state + authoritative plan
// Stripe checkout return
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('upgrade')==='success'){var tr=(q.get('tier')||'pro').toLowerCase();cfg.plan=tr;saveCfg();track('checkout_success',{tier:tr});setTimeout(function(){alert('Welcome to BullrunIQ '+tr.toUpperCase()+'! Your subscription is active — AI is now unlimited.');},400);}
})();
document.getElementById('hDate').textContent=today();
render();
if(all().length)refreshAll();
setTimeout(function(){gradeCalls();},5000); // grade any matured calls shortly after load
// Auto-refresh — crypto every 90s (CoinGecko free tier updates ~60s anyway)
// Stocks and fear/greed have their own internal caches so they won't actually
// re-fetch unless stale, keeping the app responsive between explicit refreshes
// Refresh every 60s with Finnhub (real-time), 90s otherwise
setInterval(function(){
  if(!busy)refreshAll();
},cfg.fh?60000:90000);
</script>
