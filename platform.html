<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BullrunIQ — Command Center</title>
<meta name="description" content="Your AI financial command center: live portfolio tracking, a four-agent market council, buy/sell signals, allocation & risk analysis, and a net-worth roadmap — all in one place.">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505' stroke='%23c9a84c' stroke-opacity='0.5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c9a84c'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BullrunIQ">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050505;--s1:#0d0d0d;--s2:#141414;
  --b1:#1a1a1a;--b2:#242424;--b3:#2e2e2e;
  --gold:#c9a84c;--g8:rgba(201,168,76,.08);--g15:rgba(201,168,76,.15);
  --t:#ececec;--t2:#888;--t3:#444;
  --red:#e05555;--r8:rgba(224,85,85,.08);--r2:rgba(224,85,85,.2);
  --grn:#4ade80;--gn8:rgba(74,222,128,.08);--gn2:rgba(74,222,128,.2);
  --blue:#4a9eff;--bl8:rgba(74,158,255,.08);--bl2:rgba(74,158,255,.2);
  --pur:#a855f7;--p8:rgba(168,85,247,.08);--p2:rgba(168,85,247,.2);
  --ora:#e0894a;--o8:rgba(224,137,74,.08);--o2:rgba(224,137,74,.2);
  --lime:#c8f135;--l8:rgba(200,241,53,.08);--l2:rgba(200,241,53,.15);
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);font-size:13px;overflow-x:hidden}
button,input,select,textarea{font-family:'DM Sans',sans-serif}
a{text-decoration:none;color:inherit}
.mono{font-family:'DM Mono',monospace}

.app{display:flex;flex-direction:column;height:100vh}

/* Header */
.hdr{padding:11px 24px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:14px;flex-shrink:0;background:var(--s1)}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.logo-text{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.logo-text span{color:var(--gold)}
.hdr-date{font-size:10px;color:var(--t3);flex-shrink:0}
.hdr-stats{display:flex;gap:16px;margin-left:auto;align-items:center}
.hdr-stat{text-align:right}
.hdr-val{font-size:17px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.hdr-lbl{font-size:9px;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.sep{width:1px;height:28px;background:var(--b2);flex-shrink:0}
.icon-btn{background:none;border:1px solid var(--b2);border-radius:6px;color:var(--t3);font-size:11px;padding:6px 12px;transition:all .2s;cursor:pointer}
.icon-btn:hover{border-color:var(--g15);color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .7s linear infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.chat-bubble-agent{background:var(--s2);border:1px solid var(--b2);border-radius:14px;border-bottom-left-radius:3px;padding:11px 15px;font-size:12px;line-height:1.6;max-width:82%;color:var(--t)}
.chat-bubble-user{background:var(--b2);border-radius:14px;border-bottom-right-radius:3px;padding:11px 15px;font-size:12px;line-height:1.6;max-width:75%;color:var(--t)}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 140px);max-height:800px}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 0 12px;display:flex;flex-direction:column;gap:14px}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-track{background:transparent}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.chat-input-row{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px solid var(--b1);flex-shrink:0}
.agent-pill{flex:1;padding:10px 10px;border-radius:8px;border:1px solid var(--b2);background:transparent;cursor:pointer;transition:all .2s;text-align:center}
.agent-pill.active{border-color:rgba(var(--agent-rgb),.4);background:rgba(var(--agent-rgb),.07)}

/* Tabs */
.tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--b1);background:var(--s1);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-size:11px;font-weight:500;padding:10px 14px;white-space:nowrap;transition:all .15s;margin-bottom:-1px;letter-spacing:.3px;cursor:pointer}
.tab:hover{color:var(--t2)}
.tab.on{color:var(--t);border-bottom-color:var(--gold)}
.tab{font-size:12px;padding:12px 16px}
/* Sub-navigation chips (second level, plain language) */
.subtabs{display:flex;gap:8px;padding:10px 24px 0;flex-wrap:wrap;flex-shrink:0}
.subtab{background:var(--s1);border:1px solid var(--b1);border-radius:16px;color:var(--t2);font-size:11px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:all .15s}
.subtab:hover{color:var(--t)}
.subtab.on{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.45);color:var(--gold);font-weight:600}
/* Plain-English intro line atop each view */
.view-intro{font-size:12px;color:var(--t2);margin:0 0 14px;line-height:1.6}
/* Mobile bottom navigation (Robinhood-style) */
#navBottom{display:none}
@media(max-width:700px){
  .tabs{display:none}
  .subtabs{padding:10px 14px 0}
  #navBottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(10,10,12,.97);backdrop-filter:blur(14px);border-top:1px solid var(--b2);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav{flex:1;background:none;border:none;color:var(--t3);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;font-family:inherit}
  .bnav .bnav-ico{font-size:17px;line-height:1}
  .bnav.on{color:var(--gold)}
  .content{padding-bottom:92px!important}
}

/* Content */
.content{flex:1;overflow-y:auto;padding:18px 24px 48px}

/* Section headers */
.sh{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--b1)}
.sh.gold{color:var(--gold)}.sh.blue{color:var(--blue)}.sh.red{color:var(--red)}.sh.grn{color:var(--grn)}.sh.pur{color:var(--pur)}

/* Cards */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.card.gl{border-left:2px solid var(--gold)}
.card.bl{border-left:2px solid var(--blue)}
.card.rl{border-left:2px solid var(--red)}
.card.gnl{border-left:2px solid var(--grn)}
.card.pl{border-left:2px solid var(--pur)}

/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

/* Stat chips */
.sc{background:var(--s2);border:1px solid var(--b1);border-radius:6px;padding:10px 12px}
.sc-n{font-size:19px;font-weight:500;line-height:1;font-family:'DM Mono',monospace}
.sc-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}

/* Buttons */
.btn{border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;padding:9px 18px;transition:all .2s}
.btn-g{background:var(--gold);color:#000}
.btn-g:hover{filter:brightness(1.1)}
.btn-o{background:none;border:1px solid var(--b2);color:var(--t2);border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;padding:7px 14px;transition:all .2s}
.btn-o:hover{border-color:var(--g15);color:var(--gold)}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-r{background:none;border:1px solid var(--r2);color:var(--red);border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;padding:6px 14px;transition:all .2s}

/* Form */
.inp{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-size:12px;padding:8px 12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--g15)}
.inp::placeholder{color:var(--t3)}
.sel{background:var(--s2);border:1px solid var(--b2);border-radius:6px;color:var(--t2);font-size:12px;padding:8px 12px;outline:none;cursor:pointer}
.sel option{background:#0d0d0d}
.lbl{font-size:10px;color:var(--t3);letter-spacing:.4px;margin-bottom:4px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;flex:1;min-width:90px}

/* Holdings table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:8px 12px;border-bottom:1px solid var(--b1);text-align:right;font-weight:500;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--b1);font-size:12px;text-align:right;vertical-align:middle}
.tbl td:first-child{text-align:left}
/* Actions column pinned to the right edge so Edit/delete are always reachable
   even when the table scrolls horizontally on small screens */
.tbl th.act-col,.tbl td.act-col{position:sticky;right:0;background:var(--s1);box-shadow:-8px 0 10px -8px rgba(0,0,0,.7)}
/* Holdings: table on desktop, Robinhood-style cards on phones */
.hold-cards{display:none}
.hcard{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:9px}
.hcard-top{display:flex;align-items:center;gap:10px}
.hcard-val{margin-left:auto;text-align:right;flex-shrink:0}
@media(max-width:700px){.hold-tbl-wrap{display:none!important}.hold-cards{display:block}}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--s2)}
.ac{display:flex;align-items:center;gap:9px}
.aico{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.anm{font-size:12px;font-weight:500}
.atk{font-size:10px;color:var(--t3);letter-spacing:.5px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.del-btn{background:none;border:none;color:var(--b3);cursor:pointer;font-size:12px;padding:2px 5px;transition:color .15s}
.del-btn:hover{color:var(--red)}

/* Agent cards */
.ag{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:14px 16px}
.ag-hdr{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ag-ico{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ag-name{font-size:12px;font-weight:700;letter-spacing:.4px}
.ag-role{font-size:10px;color:var(--t3)}
.verdict{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.8px;padding:3px 9px;border-radius:4px;margin-bottom:7px}
.vBUY{background:var(--gn8);border:1px solid var(--gn2);color:var(--grn)}
.vSELL{background:var(--r8);border:1px solid var(--r2);color:var(--red)}
.vHOLD{background:var(--g8);border:1px solid var(--g15);color:var(--gold)}
.vWATCH{background:var(--bl8);border:1px solid var(--bl2);color:var(--blue)}
.conf-row{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-bottom:4px}
.cbar{height:3px;background:var(--b2);border-radius:2px;overflow:hidden;margin-bottom:9px}
.cfill{height:100%;border-radius:2px;transition:width .9s}
.ag-take{font-size:11px;line-height:1.65;color:var(--t2);margin-bottom:8px}
.sig-list{display:flex;flex-direction:column;gap:3px}
.sig{font-size:10px;color:var(--t3);display:flex;gap:6px}
.sig::before{content:'→';color:var(--gold);flex-shrink:0}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.ld{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:11px;font-style:italic;padding:16px 0}
.dot{animation:pulse 1.2s infinite}

/* Consensus */
.con{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:16px 20px;margin-bottom:14px;text-align:center}
.con-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.con-v{font-size:26px;font-weight:700;letter-spacing:2px;margin-bottom:3px}
.con-sub{font-size:11px;color:var(--t2)}
.vbar{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0 0}
.vseg{border-radius:2px;transition:flex .5s}

/* Bet card */
.bet-card{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:20px 22px}
.bet-badge{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:4px;display:inline-block;margin-bottom:12px}
.bet-event{font-size:18px;font-weight:600;margin-bottom:4px;line-height:1.3}
.bet-pick{font-size:14px;color:var(--gold);font-weight:500;margin-bottom:14px}
.bet-meta{display:flex;gap:18px;margin-bottom:14px;flex-wrap:wrap}
.bet-m{font-size:11px;color:var(--t3)}
.bet-m span{color:var(--t);font-weight:500}
.cm-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--t3);margin-bottom:5px}
.cm-track{height:6px;background:var(--b2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.cm-fill{height:100%;border-radius:3px;transition:width 1s}
.bet-reason{font-size:12px;line-height:1.75;color:var(--t2)}
.bet-warn{font-size:10px;color:var(--t3);margin-top:12px;padding-top:10px;border-top:1px solid var(--b1);font-style:italic}

/* Long term */
.lt-card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:14px 16px;margin-bottom:8px}
.lt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lt-tick{font-size:15px;font-weight:700;color:var(--gold)}
.lt-conv{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:4px}
.conv-HIGH{background:var(--gn8);border:1px solid var(--gn2);color:var(--grn)}
.conv-MEDIUM{background:var(--g8);border:1px solid var(--g15);color:var(--gold)}
.lt-reason{font-size:12px;line-height:1.65;color:var(--t2);margin-bottom:5px}
.lt-target{font-size:10px;color:var(--t3)}

/* Settings */
.key-wrap{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.key-title{font-size:12px;font-weight:600;margin-bottom:3px}
.key-desc{font-size:10px;color:var(--t3);margin-bottom:10px;line-height:1.5}
.key-status{font-size:10px;font-weight:600;margin-left:8px}
.key-ok{color:var(--grn)}.key-no{color:var(--t3)}

/* Empty state */
.empty{text-align:center;color:var(--t3);padding:36px;font-size:12px;font-style:italic}

@media(max-width:900px){.g5{grid-template-columns:repeat(3,1fr)}.ag-grid{grid-template-columns:1fr!important}}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.hdr-stats{gap:10px}.content{padding:12px 14px 40px}.tabs{padding:0 14px}}
@media(max-width:480px){.g2,.g3{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}.hdr{padding:9px 14px}}
/* Dashboard chart */
.dash-chart-wrap{border:1px solid var(--b1);border-radius:8px;overflow:hidden;background:var(--s1);margin-bottom:14px}
.dash-chart-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b1)}
.dash-chart-title{font-size:11px;font-weight:600;letter-spacing:.3px}
.dash-tf{display:flex;gap:4px}
.dash-tf button{background:none;border:1px solid var(--b2);border-radius:4px;color:var(--t3);cursor:pointer;font-size:10px;padding:3px 9px;transition:all .15s}
.dash-tf button.on{background:var(--g8);border-color:var(--g15);color:var(--gold)}
/* Import */
.imp-card{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.imp-logo{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.imp-name{font-size:12px;font-weight:600}
.imp-desc{font-size:10px;color:var(--t3);line-height:1.5;margin-bottom:10px}
.drop-zone{border:2px dashed var(--b2);border-radius:6px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.drop-zone:hover,.drop-zone.drag{border-color:var(--g15);background:var(--g8)}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop-lbl{font-size:11px;color:var(--t3)}
.drop-lbl span{color:var(--gold);font-weight:500}
.imp-result{margin-top:8px;font-size:11px;padding:6px 10px;border-radius:5px;display:none}
.imp-ok{background:var(--gn8);border:1px solid var(--gn2);color:var(--grn)}
.imp-err{background:var(--r8);border:1px solid var(--r2);color:var(--red)}
/* Chart tab */
.chart-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tf-btn{background:var(--s2);border:1px solid var(--b2);border-radius:5px;color:var(--t3);cursor:pointer;font-size:11px;font-weight:500;padding:5px 12px;transition:all .15s}
.tf-btn.on{background:var(--g8);border-color:var(--g15);color:var(--gold)}
.asset-sel{background:var(--s2);border:1px solid var(--b2);border-radius:6px;color:var(--t);font-size:12px;font-weight:500;padding:6px 12px;outline:none;cursor:pointer;min-width:140px}
.asset-sel option{background:#0d0d0d}
.chart-wrap{border:1px solid var(--b1);border-radius:8px;overflow:hidden;margin-bottom:14px;background:var(--s1)}
/* Heat map */
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:6px;margin-bottom:14px}
.heat-cell{border-radius:7px;padding:11px 10px;display:flex;flex-direction:column;gap:3px;transition:filter .15s;cursor:pointer}
.heat-cell:hover{filter:brightness(1.15)}
.heat-cell-tick{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--t3)}
.heat-cell-pct{font-size:15px;font-weight:600;font-family:'DM Mono',monospace;line-height:1}
.heat-cell-val{font-size:9px;color:var(--t3)}
/* Watchlist */
.wl-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--b1)}
.wl-row:last-child{border-bottom:none}
.sig-panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.sig-card{background:var(--s2);border:1px solid var(--b1);border-radius:7px;padding:12px 14px}
.sig-card-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.sig-card-val{font-size:16px;font-weight:600;font-family:'DM Mono',monospace;line-height:1;margin-bottom:2px}
.sig-card-sub{font-size:10px;color:var(--t3)}
.edu-card{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:14px 16px;margin-bottom:8px}
.edu-title{font-size:11px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.edu-body{font-size:11px;line-height:1.75;color:var(--t2)}
.signal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.loading-chart{display:flex;align-items:center;justify-content:center;height:380px;color:var(--t3);font-size:12px;gap:8px}
@media(max-width:600px){.sig-panel{grid-template-columns:1fr 1fr}}
</style>
</head>

// ── Format ─────────────────────────────────────────────────────
function f$(v){if(v===null||v===undefined)return'—';var a=Math.abs(v);var s=v<0?'-':'';return s+'$'+(a>=1e9?(a/1e9).toFixed(2)+'B':a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?a.toLocaleString('en-US',{maximumFractionDigits:0}):a.toFixed(2));}
function fp(v){if(!v&&v!==0)return'—';return v>=1e3?'$'+v.toLocaleString('en-US',{maximumFractionDigits:2}):v>=1?'$'+v.toFixed(2):'$'+v.toFixed(6);}
function fpc(v){if(v===null||v===undefined)return'—';return(v>=0?'+':'')+v.toFixed(2)+'%';}
function today(){return new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}

// ── Portfolio totals ───────────────────────────────────────────
function totals(){
  var tv=0,tc=0;
  all().forEach(function(h){var p=pof(h);tv+=p*h.qty;tc+=h.avg*h.qty;});
  tv+=(port.cash||0); // cash counts toward total wealth, not cost basis
  return{tv:tv,tc:tc,pnl:tv-(port.cash||0)-tc,pct:tc>0?((tv-(port.cash||0)-tc)/tc)*100:0};
}
function all(){return port.crypto.concat(port.stocks);}
function pof(h){var p=prices[h.ticker];return p?p.price:h.avg;}
function chof(h){var p=prices[h.ticker];return p?p.change24:null;}

// ── Fetch: Crypto prices (CoinGecko) ──────────────────────────
// Min 50s between auto-fetches; pass force=true to bypass
async function fetchCrypto(force){
  if(!force&&Date.now()-_cryptoAt<50000)return;
  var ANCHORS=['BTC','ETH'];
  var portfolioTicks=port.crypto.map(function(h){return h.ticker.toUpperCase();});
  var ticks=[...new Set(ANCHORS.concat(portfolioTicks))];
  var ids=[...new Set(ticks.map(function(t){return CGMAP[t]||t.toLowerCase();}))];
  try{
    var r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids.join(',')+'&vs_currencies=usd&include_24hr_change=true');
    var d=await r.json();
    ticks.forEach(function(t){var id=CGMAP[t]||t.toLowerCase();if(d[id])prices[t]={price:d[id].usd,change24:d[id].usd_24h_change||0};});
    _cryptoAt=Date.now();savePr();
  }catch(e){}
}

// ── Fetch: Stock prices ───────────────────────────────────────
// Primary: Finnhub (real-time, 60 req/min, free — finnhub.io)
// Fallback: Alpha Vantage (15-20 min delayed, 25 req/day)
async function fetchStockFinnhub(ticker){
  if(!cfg.fh)return false;
  try{
    var r=await fetch('https://finnhub.io/api/v1/quote?symbol='+ticker+'&token='+cfg.fh);
    if(!r.ok)return false;
    var d=await r.json();
    if(d&&d.c&&d.c>0){
      var pct=d.pc>0?((d.c-d.pc)/d.pc*100):0;
      prices[ticker]={price:d.c,change24:+pct.toFixed(2),open:d.o,high:d.h,low:d.l,prevClose:d.pc,src:'finnhub'};
      return true;
    }
  }catch(e){}
  return false;
}
async function fetchStockAV(ticker){
  if(!cfg.av)return;
  try{
    var r=await fetch('https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol='+ticker+'&apikey='+cfg.av);
    var d=await r.json();var q=d['Global Quote'];
    if(q&&q['05. price']){
      var pct=parseFloat((q['10. change percent']||'0').replace('%',''));
      prices[ticker]={price:parseFloat(q['05. price']),change24:pct,src:'alphavantage'};
    }
  }catch(e){}
}
async function fetchStocks(force){
  var cacheMs=cfg.fh?60000:720000; // 1 min (Finnhub real-time) vs 12 min (AV delayed)
  if(!force&&Date.now()-_stocksAt<cacheMs)return;
  if(!port.stocks.length||(!cfg.fh&&!cfg.av))return;
  var ticks=[...new Set(port.stocks.map(function(h){return h.ticker.toUpperCase();}))];
  for(var i=0;i<ticks.length;i++){
    var ok=await fetchStockFinnhub(ticks[i]);
    if(!ok)await fetchStockAV(ticks[i]);
    if(i<ticks.length-1)await sleep(cfg.fh?150:1300);
  }
  _stocksAt=Date.now();savePr();
}

  try{

function _ago(ts){
  var m=Math.max(1,Math.round((Date.now()-ts)/60000));
  if(m<60)return m+'m ago';
  var h=Math.round(m/60);if(h<24)return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function newsHeadlines(n){
  return news.items.slice(0,n||8).map(function(x){return '- '+x.t+' ('+x.s+', '+_ago(x.at)+')';}).join('\n');
}

// ── Price alert check ─────────────────────────────────────────
function checkAlerts(){
  wl.forEach(function(w){
    if(!w.targetPrice)return;
    var p=prices[w.ticker];
    if(!p)return;
    var dist=Math.abs((w.targetPrice-p.price)/p.price*100);
    if(dist<2&&!w.alerted){
      w.alerted=true;saveWl();
      if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
        new Notification('BullrunIQ: '+w.ticker+' near target!',{body:w.ticker+' is within 2% of your target '+fp(w.targetPrice)+'. Now: '+fp(p.price)});
      }
    } else if(dist>=5){w.alerted=false;}
  });
}

// ── Account: magic-code login + cloud sync ────────────────────
function loggedIn(){return !!auth.token;}
async function authRequest(){
  var em=v('acctEmail').toLowerCase();
  var st=document.getElementById('acctStatus');
  if(!em||em.indexOf('@')<1){st.textContent='Enter a valid email.';st.style.color='var(--red)';return;}
  st.textContent='Sending code…';st.style.color='var(--t2)';
  try{
    var r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request',email:em})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    _acctEmailPending=em;
    document.getElementById('acctCodeRow').style.display='flex';
    st.textContent='Code sent — check '+em+' (and spam).';st.style.color='var(--grn)';
  }catch(e){st.textContent='✕ '+e.message;st.style.color='var(--red)';}
}
async function authVerify(){
  var code=v('acctCode');var st=document.getElementById('acctStatus');
  st.textContent='Verifying…';st.style.color='var(--t2)';
  try{
    var r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',email:_acctEmailPending,code:code})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    auth={token:d.token,email:d.email};saveAuth();
    cfg.plan=d.plan||'free';saveCfg();
    track('login');
    await pullSync(true);
    render();
  }catch(e){st.textContent='✕ '+e.message;st.style.color='var(--red)';}
}
function authLogout(){auth={token:'',email:''};saveAuth();render();}
// Cross-device strategy: every local change pushes (debounced), so the cloud copy
// is always the most recent device's state. On login/pull, cloud wins when it has
// holdings; a device with local data and an empty cloud pushes instead.
function _cloudPayload(){return {v:1,port:port,wl:wl,goal:goal,calls:calls};}
async function pullSync(preferCloud){
  if(!loggedIn())return;
  try{
    var r=await fetch('/api/sync',{headers:{'Authorization':'Bearer '+auth.token}});
    if(r.status===401){authLogout();return;}
    var d=await r.json();
    if(d.plan!==undefined&&cfg.plan!==d.plan){cfg.plan=d.plan;saveCfg();} // server plan is authoritative (auto-revoke on cancel)
    var cd=d.data;
    var localHas=all().length>0&&!isDemo(); // the demo showroom never blocks real cloud data
    var cloudHas=!!(cd&&cd.port&&((cd.port.crypto||[]).length+(cd.port.stocks||[]).length)>0);
    if(cloudHas&&(preferCloud||!localHas)){
      try{localStorage.removeItem(DEMOK);}catch(e){} // real cloud data replaces the showroom
      port=cd.port;if(!port.cash)port.cash=0;wl=cd.wl||wl;if(cd.goal!==undefined)goal=cd.goal;
      if(Array.isArray(cd.calls)&&cd.calls.length>=calls.length)calls=cd.calls;
      savePort();saveWl();saveGoal();saveCalls();
    } else if(localHas&&!cloudHas){schedulePush();}
    render();refreshAll();
  }catch(e){}
}
var _pushT=null;
function schedulePush(){
  if(!loggedIn())return;
  if(isDemo())return; // never sync the demo showroom to a real account
  clearTimeout(_pushT);
  _pushT=setTimeout(function(){
    fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+auth.token},body:JSON.stringify({data:_cloudPayload()})})
      .then(function(r){return r.json();})
      .then(function(d){if(d&&d.plan!==undefined&&cfg.plan!==d.plan){cfg.plan=d.plan;saveCfg();updateCreditChip();}})
      .catch(function(){});
  },1500);
}

function weekKey(){var d=new Date();var oj=new Date(d.getFullYear(),0,1);var wk=Math.ceil((((d-oj)/86400000)+oj.getDay()+1)/7);return d.getFullYear()+'-W'+wk;}
function _ensureWeek(){var w=weekKey();if(usage.week!==w){usage.week=w;usage.count=0;saveUsage();}}
function hasBYOK(){return !!cfg.ak;}
function isPaid(){return cfg.plan&&cfg.plan!=='free';}
function aiUnlimited(){return hasBYOK()||isPaid();}
function aiLeft(){_ensureWeek();return aiUnlimited()?Infinity:Math.max(0,FREE_WEEKLY_AI-usage.count);}
function _spendAI(){_ensureWeek();usage.count++;saveUsage();updateCreditChip();}

  if(aiUnlimited())return true;

  _spendAI();return true;
}

// ── Claude call ───────────────────────────────────────────────
async function claude(system,user,maxTok){
  var r=await anthropicCall({model:MODEL_SMART,max_tokens:maxTok||600,system:system,messages:[{role:'user',content:user}]});
  var raw=await r.text();
  if(!r.ok)throw _aiErr(r.status,raw);
  try{var d=JSON.parse(raw);return d.content[0].text;}
  catch(ex){throw new Error('Bad response: '+raw.slice(0,300));}
}
// ── Claude call — JSON mode ───────────────────────────────────
async function claudeJSON(system,user,maxTok,model){
  var body={model:model||MODEL_SMART,max_tokens:maxTok||600,
    system:system+'\n\nCRITICAL: your entire response must be a single raw JSON object. No markdown, no explanation, no code fences. Start with { and end with }.',
    messages:[{role:'user',content:user}]};
  var r=await anthropicCall(body);
  var raw=await r.text();
  if(!r.ok)throw _aiErr(r.status,raw);
  try{var d=JSON.parse(raw);return d.content[0].text;}
  catch(ex){throw new Error('Bad response from Claude: '+raw.slice(0,300));}
}
function parseJSON(text){
  // Strip markdown code fences
  text=text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
  // Extract first JSON object
  var m=text.match(/\{[\s\S]*\}/);
  if(!m)throw new Error('No JSON found in response');
  var raw=m[0];
  // Close any truncated arrays/objects caused by token limits
  var opens=(raw.match(/\[/g)||[]).length-(raw.match(/\]/g)||[]).length;
  var objOpens=(raw.match(/\{/g)||[]).length-(raw.match(/\}/g)||[]).length;
  for(var i=0;i<opens;i++)raw+=']';
  for(var i=0;i<objOpens;i++)raw+='}';
  // Remove trailing commas before closing brackets
  raw=raw.replace(/,(\s*[\]\}])/g,'$1');
  try{return JSON.parse(raw);}
  catch(e){throw new Error('JSON parse failed: '+e.message);}
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  if(cryptoTickers.length){

    try{
      var r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+ids+'&order=market_cap_desc&per_page=50&page=1&sparkline=false&price_change_percentage=1y,200d');

      d.forEach(function(c){
        var tk=Object.keys(CGMAP).find(function(k){return CGMAP[k]===c.id;})||c.symbol.toUpperCase();
        result[tk]={
          rank:c.market_cap_rank,
          marketCap:c.market_cap,
          ath:c.ath,
          athDate:c.ath_date?c.ath_date.split('T')[0]:null,
          pctFromAth:c.ath_change_percentage?+c.ath_change_percentage.toFixed(1):null,
          return1y:c.price_change_percentage_1y_in_currency?+c.price_change_percentage_1y_in_currency.toFixed(1):null,
          return200d:c.price_change_percentage_200d_in_currency?+c.price_change_percentage_200d_in_currency.toFixed(1):null,
          vol24h:c.total_volume,
          circulatingSupply:c.circulating_supply,
          maxSupply:c.max_supply
        };
      });
    }catch(e){}
  }
  // Stocks: fetch fundamentals from Alpha Vantage OVERVIEW
  if(cfg.av){
    var stockTickers=holdings.filter(function(h){return port.stocks.some(function(s){return s.ticker===h.ticker;});}).map(function(h){return h.ticker;});
    await Promise.allSettled(stockTickers.map(async function(tk){
      try{
        var r=await fetch('https://www.alphavantage.co/query?function=OVERVIEW&symbol='+tk+'&apikey='+cfg.av);
        var d=await r.json();
        if(d.Symbol){result[tk]={sector:d.Sector,industry:d.Industry,marketCap:d.MarketCapitalization,pe:d.PERatio,eps:d.EPS,high52w:d['52WeekHigh'],low52w:d['52WeekLow'],ma50:d['50DayMovingAverage'],ma200:d['200DayMovingAverage'],dividendYield:d.DividendYield};}
      }catch(e){}
    }));
  }
  return result;
}

// ── Technical reads for the Council ───────────────────────────
// Computes tradeRead (trend lines / MACD / structure / pressure) for the top
// holdings so the agents reason FROM real fitted levels instead of inventing
// numbers. Reuses the chartOHLC cache; fetches at most 5 assets, gently.
async function buildTechReads(){
  try{
    var byVal=all().slice().sort(function(a,b){return pof(b)*b.qty-pof(a)*a.qty;});
    var picksT=byVal.slice(0,4).map(function(h){return h.ticker;});
    if(picksT.indexOf('BTC')<0)picksT.unshift('BTC');
    picksT=picksT.slice(0,5);
    var lines=[];
    for(var i=0;i<picksT.length;i++){
      var tk=picksT[i];
      var cached=!!chartOHLC[tk+'-180'];
      var cs=await fetchOHLC(tk,180);
      var tr2=tradeRead(cs);
      if(tr2){
        lines.push(tk+': '+tr2.score+'/100 '+tr2.verdict.label
          +' | '+tr2.structure.trend
          +' | buyers\' line '+(tr2.lines.sup?fp(tr2.lines.sup.now)+' ('+tr2.lines.sup.dir+', price '+(tr2.lines.sup.distPct>=0?'+':'')+tr2.lines.sup.distPct.toFixed(1)+'% vs line)':'n/a')
          +' | sellers\' line '+(tr2.lines.res?fp(tr2.lines.res.now)+' ('+(tr2.lines.res.distPct>0?'BROKEN OUT':Math.abs(tr2.lines.res.distPct).toFixed(1)+'% overhead')+')':'n/a')
          +' | MACD '+(tr2.macd?((tr2.macd.bullish?'bullish':'bearish')+(tr2.macd.cross?' fresh '+tr2.macd.cross+' cross':'')):'n/a')
          +' | buyers '+tr2.pressure+'%'
          +' | buy '+fp(tr2.levels.buyAt)+' / target '+fp(tr2.levels.target)+' / stop '+fp(tr2.levels.stop));
      }
      if(!cached&&i<picksT.length-1)await sleep(1500);
    }
    if(!lines.length)return'';
    return'TECHNICAL READS (trend lines auto-fitted through swing pivots on 6-month price action; MACD 12/26/9; buyer pressure from candle anatomy — ground every entry, stop and take-profit in THESE exact levels, do not invent your own):\n'+lines.join('\n')+'\n\n';
  }catch(e){return'';}
}

  var fg=fearGreed?'Fear & Greed Index: '+fearGreed.value+'/100 ('+fearGreed.label+')\n':'';
  var btcLine=btcPrice?'BTC LIVE PRICE: $'+btcPrice.toLocaleString()+' ('+(btcChange>=0?'+':'')+btcChange.toFixed(2)+'% 24h)\n':'';
  var now=new Date();

  var cycleContext='BITCOIN CYCLE METRICS:\n'+

    '• Historical reference — 2020 halving (May 11 2020): day '+daysSinceHalving+' was approx '+new Date(new Date('2020-05-11').getTime()+daysSinceHalving*86400000).toISOString().split('T')[0]+'\n'+
    '• Historical reference — 2016 halving (Jul 9 2016): day '+daysSinceHalving+' was approx '+new Date(new Date('2016-07-09').getTime()+daysSinceHalving*86400000).toISOString().split('T')[0]+'\n'+
    (btcPctFromAth?'• BTC % from current cycle ATH: '+btcPctFromAth+'%\n':'')+
    fg+btcLine;

  var newsBlock=news.items.length?'TODAY\'S HEADLINES (live news feed — factor these into your analysis and cite the relevant ones):\n'+newsHeadlines(8)+'\n\n':'';

  var userMsg=priceWarning+
    'MARKET SNAPSHOT — '+timeStr+'\n\n'+
    cycleContext+'\n'+
    newsBlock+
    techReads+
    'LIVE PORTFOLIO DATA:\n'+JSON.stringify(richHoldings)+'\n\n'+
    'Compare current moment to the same day in the 2020 and 2016 halving cycles. Find the historical analog. Analyze next 72 hours based on what history shows happened from this cycle position. Anchor all entry/stopLoss/takeProfit values to the TECHNICAL READS levels when provided.\n\nOutput only the JSON object now, starting with {:';

  // Step 4: Run CYCLE, ANALOG, DIVERGE in parallel
  var first3=await Promise.allSettled([
    claudeJSON(AGENTS[0].sys,userMsg,800),
    claudeJSON(AGENTS[1].sys,userMsg,800),
    claudeJSON(AGENTS[2].sys,userMsg,800)
  ]);
  var agentOutputs=[];
  [0,1,2].forEach(function(i){

    if(res.status==='fulfilled'){try{parsed=parseJSON(res.value);}catch(e){err='Parse: '+e.message;}}

  var tacticalMsg=priceWarning+

    'LIVE PORTFOLIO:\n'+JSON.stringify(richHoldings)+'\n\n'+
    techReads+
    'CYCLE, ANALOG, DIVERGE analyses:\n'+agentOutputs.join('\n\n')+

  try{
    var tText=await claudeJSON(AGENTS[3].sys,tacticalMsg,900,MODEL_HEAVY);

    }catch(e){}
  }catch(e){
    agents[3]={id:AGENTS[3].id,loading:false,error:e.message,data:null};
  }
  saveAg();render();
}

  var nm=v('hn'),tk=v('ht').toUpperCase(),qty=parseFloat(v('hq')),avg=parseFloat(v('ha'));
  if(!nm||!tk||!qty||!avg)return;
  exitDemoIfActive();
  var h={id:Date.now(),name:nm,ticker:tk,qty:qty,avg:avg,type:type};
  if(type==='crypto')port.crypto.push(h);else port.stocks.push(h);
  ['hn','ht','hq','ha'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  savePort();refreshAll();
}
function delHolding(type,id){
  if(type==='crypto')port.crypto=port.crypto.filter(function(h){return h.id!==id;});
  else port.stocks=port.stocks.filter(function(h){return h.id!==id;});
  // Emptying the book is deliberate — don't resurrect the demo portfolio on reload
  if(!all().length){try{localStorage.removeItem(DEMOK);localStorage.setItem('briq-demo-off','1');}catch(e){}}
  savePort();render();
}
function v(id){var el=document.getElementById(id);return el?el.value.trim():'';}

// ── Consensus helper ──────────────────────────────────────────
function consensus(){
  var done=agents.filter(function(a){return a.data;});
  if(!done.length)return null;
  var votes={};var conf=0;
  done.forEach(function(a){votes[a.data.verdict]=(votes[a.data.verdict]||0)+1;conf+=a.data.confidence;});
  var top=Object.keys(votes).sort(function(a,b){return votes[b]-votes[a];})[0];
  return{verdict:top,votes:votes,count:done.length,avgConf:Math.round(conf/done.length)};
}

// ── Dashboard portfolio history chart ─────────────────────────
var dashDays=30;
var portfolioHistory={};

async function fetchPortfolioHistory(days){
  var key='ph-'+days;
  if(portfolioHistory[key])return portfolioHistory[key];

  var cryptos=port.crypto;
  if(!cryptos.length){portfolioHistory[key]=[];return[];}

  // Fetch OHLC (daily candles) for each crypto — reuse existing fetcher
  var tickerCandles={};
  for(var i=0;i<cryptos.length;i++){
    var candles=await fetchOHLC(cryptos[i].ticker,days);
    if(candles&&candles.length){tickerCandles[cryptos[i].ticker]=candles;}
    if(i<cryptos.length-1)await sleep(300);
  }

  // Build a map: timestamp → {ticker: closePrice}
  // Only use tickers that actually returned data
  var validTickers=Object.keys(tickerCandles);
  if(!validTickers.length){portfolioHistory[key]=[];return[];}

  var byDay={};
  validTickers.forEach(function(ticker){
    tickerCandles[ticker].forEach(function(c){
      var ts=typeof c.time==='number'?c.time:new Date(c.time).getTime()/1000;
      // Round to day
      ts=Math.floor(ts/86400)*86400;
      if(!byDay[ts])byDay[ts]={};
      byDay[ts][ticker]=c.close; // overwrite → last candle of day wins
    });
  });

  // Only keep days where EVERY valid ticker has data (no fallback to current price)
  var allTs=Object.keys(byDay).filter(function(ts){
    return validTickers.every(function(t){return byDay[ts][t]!=null;});
  }).sort(function(a,b){return a-b;});

  // Stock value at current price (flat — no free historical stock data)
  var stockVal=port.stocks.reduce(function(s,h){
    return s+(prices[h.ticker]?prices[h.ticker].price:h.avg)*h.qty;
  },0);

  var series=allTs.map(function(ts){
    var cryptoVal=0;
    validTickers.forEach(function(ticker){
      var holding=cryptos.find(function(h){return h.ticker===ticker;});
      if(holding)cryptoVal+=byDay[ts][ticker]*holding.qty;
    });
    return{time:parseInt(ts),value:parseFloat((cryptoVal+stockVal).toFixed(2))};
  });

  portfolioHistory[key]=series;
  return series;
}

// ── Import: parse CSV ─────────────────────────────────────────
function parseImportCSV(text,platform){
  var lines=text.trim().split('\n').map(function(l){return l.trim();});
  if(lines.length<2)throw new Error('File too short');
  exitDemoIfActive();
  var header=lines[0].toLowerCase().split(',').map(function(h){return h.replace(/"/g,'').trim();});
  var added=0;

  // Detect format
  var isRobinhood=header.includes('average cost')&&header.includes('quantity');
  var isCoinbase=header.includes('asset')&&header.includes('quantity transacted')&&header.includes('transaction type');
  var isGeneric=header.includes('ticker')&&(header.includes('qty')||header.includes('quantity'));

  function col(row,name){var idx=header.indexOf(name);return idx>=0?(row[idx]||'').replace(/"/g,'').trim():'';}

  if(isCoinbase){
    // Coinbase is transaction history — aggregate buys to get current holdings
    var holdings2={};
    lines.slice(1).forEach(function(line){
      var row=line.split(',');
      var type=col(row,'transaction type').toLowerCase();
      var asset=col(row,'asset').toUpperCase();
      var qty=parseFloat(col(row,'quantity transacted'))||0;
      if(!asset||!qty)return;
      if(!holdings2[asset])holdings2[asset]={qty:0,cost:0,count:0};
      if(type==='buy'){holdings2[asset].qty+=qty;holdings2[asset].cost+=parseFloat(col(row,'total'))||0;holdings2[asset].count++;}
      if(type==='sell'){holdings2[asset].qty-=qty;}
      if(type==='receive'||type==='rewards income'||type==='coinbase earn'){holdings2[asset].qty+=qty;}
    });
    Object.keys(holdings2).forEach(function(ticker){
      var h=holdings2[ticker];if(h.qty<=0.000001)return;
      var avg=h.cost>0&&h.count>0?h.cost/h.count/h.qty:0;
      var existing=port.crypto.find(function(x){return x.ticker===ticker;});
      if(!existing){port.crypto.push({id:Date.now()+added,name:ticker,ticker:ticker,qty:parseFloat(h.qty.toFixed(8)),avg:avg||1,type:'crypto'});added++;}
    });
  } else if(isRobinhood){
    lines.slice(1).forEach(function(line){
      var row=line.split(',');
      var ticker=col(row,'symbol').toUpperCase();
      var qty=parseFloat(col(row,'quantity'))||0;
      var avg=parseFloat(col(row,'average cost'))||0;
      if(!ticker||!qty)return;
      var existing=port.stocks.find(function(x){return x.ticker===ticker;})||port.crypto.find(function(x){return x.ticker===ticker;});
      if(!existing){port.stocks.push({id:Date.now()+added,name:ticker,ticker:ticker,qty:qty,avg:avg,type:'stock'});added++;}
    });
  } else {
    // Generic: Name/Ticker/Qty/AvgBuy/Type
    var nameIdx=header.indexOf('name');var tickIdx=header.indexOf('ticker');var qtyIdx=header.findIndex(function(h){return h==='qty'||h==='quantity';});
    var avgIdx=header.findIndex(function(h){return h.includes('avg')||h.includes('price')||h.includes('cost');});
    var typeIdx=header.indexOf('type');
    lines.slice(1).forEach(function(line){
      var row=line.split(',');
      var ticker=(tickIdx>=0?row[tickIdx]:'').replace(/"/g,'').trim().toUpperCase();
      var name=(nameIdx>=0?row[nameIdx]:'').replace(/"/g,'').trim()||ticker;
      var qty=parseFloat((qtyIdx>=0?row[qtyIdx]:0))||0;
      var avg=parseFloat((avgIdx>=0?row[avgIdx]:0))||0;
      var type=(typeIdx>=0?row[typeIdx]:'').replace(/"/g,'').trim().toLowerCase()||'crypto';
      if(!ticker||!qty)return;
      var arr=type==='stock'?port.stocks:port.crypto;
      var existing=arr.find(function(x){return x.ticker===ticker;});
      if(!existing){arr.push({id:Date.now()+added,name:name,ticker:ticker,qty:qty,avg:avg||1,type:type});added++;}
    });
  }
  if(added===0)throw new Error('No new holdings found — may already be imported');
  savePort();return added;
}

function handleImportFile(input,platform,resultId){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var res=document.getElementById(resultId);
    try{
      var n=parseImportCSV(e.target.result,platform);
      res.className='imp-result imp-ok';res.style.display='block';
      res.textContent='✓ Imported '+n+' holdings successfully';
      portfolioHistory={};refreshAll();
    }catch(err){
      res.className='imp-result imp-err';res.style.display='block';
      res.textContent='✕ '+err.message;
    }
  };
  reader.readAsText(file);
}

// ── Chart: fetch OHLC ────────────────────────────────────────
async function fetchOHLC(ticker,days){
  var key=ticker+'-'+days;
  if(chartOHLC[key])return chartOHLC[key];
  var isStock=port.stocks.find(function(h){return h.ticker===ticker;});
  var candles=[];
  if(isStock&&cfg.av){
    try{
      var r=await fetch('https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol='+ticker+'&apikey='+cfg.av+'&outputsize=compact');
      var d=await r.json();var ts=d['Time Series (Daily)'];
      if(ts){
        candles=Object.keys(ts).sort().slice(-days).map(function(dt){
          var v=ts[dt];
          return{time:dt,open:parseFloat(v['1. open']),high:parseFloat(v['2. high']),low:parseFloat(v['3. low']),close:parseFloat(v['4. close'])};
        });
      }
    }catch(e){}
  } else {
    var id=CGMAP[ticker]||ticker.toLowerCase();
    try{
      var r2=await fetch('https://api.coingecko.com/api/v3/coins/'+id+'/ohlc?vs_currency=usd&days='+days);
      var d2=await r2.json();
      if(Array.isArray(d2)){
        candles=d2.map(function(c){return{time:Math.floor(c[0]/1000),open:c[1],high:c[2],low:c[3],close:c[4]};});
        // dedupe by time
        var seen={};candles=candles.filter(function(c){if(seen[c.time])return false;seen[c.time]=1;return true;});
      }
    }catch(e){}
  }
  if(candles.length)chartOHLC[key]=candles; // don't cache empty/failed fetches — allow retry
  return candles;
}

// ── EMA (exponential moving average) ──────────────────────────
function calcEMA(candles,period){
  if(candles.length<period)return[];
  var k=2/(period+1);var out=[];
  var ema=candles.slice(0,period).reduce(function(s,c){return s+c.close;},0)/period;
  out.push({time:candles[period-1].time,value:+ema.toFixed(6)});
  for(var i=period;i<candles.length;i++){ema=candles[i].close*k+ema*(1-k);out.push({time:candles[i].time,value:+ema.toFixed(6)});}
  return out;
}

// ── Trade engine: pivots, trend lines, MACD, structure, pressure ──
// All pure math on cached candles — renders in milliseconds, no AI round-trip.
function findPivots(candles,k){
  k=k||(candles.length>=60?3:2);
  var highs=[],lows=[];
  for(var i=k;i<candles.length-k;i++){
    var ph=true,pl=true;
    for(var j=i-k;j<=i+k;j++){
      if(candles[j].high>candles[i].high)ph=false;
      if(candles[j].low<candles[i].low)pl=false;
    }
    if(ph)highs.push({i:i,time:candles[i].time,price:candles[i].high});
    if(pl)lows.push({i:i,time:candles[i].time,price:candles[i].low});
  }
  return{highs:highs,lows:lows};
}
function fitLine(pts){
  var n=pts.length;if(n<2)return null;
  var sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(function(p){sx+=p.i;sy+=p.price;sxx+=p.i*p.i;sxy+=p.i*p.price;});
  var d=n*sxx-sx*sx;if(!d)return null;
  var m=(n*sxy-sx*sy)/d;
  return{m:m,b:(sy-m*sx)/n};
}
// Buyers' line = fit through recent swing lows; sellers' line = through swing highs.
function trendLines(candles,pivots){
  var last=candles.length-1,price=candles[last].close;
  function build(pts){
    var use=pts.slice(-6);if(use.length<2)return null;
    var f=fitLine(use);if(!f)return null;
    var now=f.m*last+f.b;
    if(now<=0)return null;
    var slope=f.m/price*100; // % of price per candle
    return{m:f.m,b:f.b,i0:use[0].i,now:now,touches:use.length,
      dir:slope>0.05?'rising':slope<-0.05?'falling':'flat',
      distPct:(price-now)/now*100};
  }
  return{sup:build(pivots.lows),res:build(pivots.highs)};
}
function calcMACD(candles){
  if(candles.length<35)return null;
  var closes=candles.map(function(c){return c.close;});
  function emaArr(arr,p){var k=2/(p+1);var out=[];var e=arr.slice(0,p).reduce(function(a,b){return a+b;},0)/p;out[p-1]=e;for(var i=p;i<arr.length;i++){e=arr[i]*k+e*(1-k);out[i]=e;}return out;}
  var e12=emaArr(closes,12),e26=emaArr(closes,26);
  var macd=[];for(var i=25;i<closes.length;i++)macd.push(e12[i]-e26[i]);
  var sig=emaArr(macd,9);
  var L=macd.length-1;
  var h1=macd[L]-sig[L],h0=macd[L-1]-sig[L-1];
  var cross=null;
  if(h1>0&&h0<=0)cross='bull';else if(h1<0&&h0>=0)cross='bear';
  return{bullish:h1>0,hist:h1,histRising:h1>h0,aboveZero:macd[L]>0,cross:cross};
}
function marketStructure(pivots){
  var hs=pivots.highs.slice(-3),ls=pivots.lows.slice(-3);
  if(hs.length<2||ls.length<2)return{trend:'RANGE',detail:'not enough swings yet'};
  var hh=hs[hs.length-1].price>hs[hs.length-2].price;
  var hl=ls[ls.length-1].price>ls[ls.length-2].price;
  if(hh&&hl)return{trend:'UPTREND',detail:'higher highs + higher lows'};
  if(!hh&&!hl)return{trend:'DOWNTREND',detail:'lower highs + lower lows'};
  return{trend:'RANGE',detail:hh?'higher highs, weak lows':'strong lows, capped highs'};
}
// Buyer vs seller pressure from candle anatomy (close location, up-candle share, body dominance)
function buyerSellerPressure(candles,n){
  n=Math.min(n||20,candles.length);
  var s=candles.slice(-n),clv=0,up=0,net=0,tot=0;
  s.forEach(function(c){
    var rng=c.high-c.low;
    if(rng>0)clv+=((c.close-c.low)-(c.high-c.close))/rng;
    if(c.close>c.open)up++;
    var b=Math.abs(c.close-c.open);net+=(c.close>=c.open?b:-b);tot+=b;
  });
  var clvS=(clv/n+1)/2,upS=up/n,bodyS=tot>0?(net/tot+1)/2:0.5;
  return Math.max(2,Math.min(98,Math.round((clvS*0.4+upS*0.3+bodyS*0.3)*100)));
}
// Composite buy-timing read: 0–100 score + verdict + exact levels
function tradeRead(candles){
  if(!candles||candles.length<25)return null;
  var last=candles[candles.length-1],price=last.close;
  var pivots=findPivots(candles);
  var tl=trendLines(candles,pivots);
  var st=marketStructure(pivots);
  var macd=calcMACD(candles);
  var press=buyerSellerPressure(candles,20);
  var rsiArr=calcRSI(candles,14);var rsi=rsiArr.length?rsiArr[rsiArr.length-1].value:50;
  var atr=calcATR(candles,14);
  var e20=calcEMA(candles,20),e50=calcEMA(candles,50);
  var emaBull=e20.length&&e50.length?(e20[e20.length-1].value>e50[e50.length-1].value&&price>e20[e20.length-1].value):null;

  var score=50,reasons=[],breakout=false,broken=false;
  if(st.trend==='UPTREND'){score+=12;reasons.push('Uptrend structure ('+st.detail+')');}
  else if(st.trend==='DOWNTREND'){score-=12;reasons.push('Downtrend structure ('+st.detail+')');}
  if(emaBull===true){score+=8;reasons.push('Price above EMA20 > EMA50 (bull stack)');}
  else if(emaBull===false){score-=8;reasons.push('Below EMA20/50 — momentum against you');}
  if(macd){
    if(macd.cross==='bull'){score+=10;reasons.push('MACD just crossed bullish');}
    else if(macd.cross==='bear'){score-=10;reasons.push('MACD just crossed bearish');}
    else if(macd.bullish&&macd.histRising){score+=5;reasons.push('MACD bullish, momentum building');}
    else if(!macd.bullish&&!macd.histRising){score-=5;reasons.push('MACD bearish, momentum fading');}
  }
  if(rsi<35){score+=8;reasons.push('RSI '+Math.round(rsi)+' oversold');}
  else if(rsi>70){score-=8;reasons.push('RSI '+Math.round(rsi)+' overbought');}
  if(tl.sup){
    if(tl.sup.distPct<-2){score-=15;broken=true;reasons.push('Price BROKE below the buyers\' line — support failed');}
    else if(tl.sup.distPct<2&&tl.sup.dir!=='falling'){score+=12;reasons.push('Sitting on the buyers\' line ('+tl.sup.dir+' support)');}
  }
  if(tl.res){
    if(tl.res.distPct>1&&press>60){score+=10;breakout=true;reasons.push('Breakout: cleared the sellers\' line with buyers in control');}
    else if(Math.abs(tl.res.distPct)<2&&!breakout){score-=6;reasons.push('Pressing the sellers\' line — expect resistance');}
  }
  if(press>=60){score+=6;reasons.push('Buyers control '+press+'% of recent candles');}
  else if(press<=40){score-=6;reasons.push('Sellers control '+(100-press)+'% of recent candles');}
  score=Math.max(5,Math.min(95,Math.round(score)));

  var verdict=score>=72?{label:'STRONG BUY ZONE',color:'var(--lime)'}
    :score>=60?{label:'BUY ZONE',color:'var(--grn)'}
    :score>=45?{label:'HOLD / NEUTRAL',color:'var(--gold)'}
    :score>=33?{label:'CAUTION — TRIM',color:'var(--ora)'}
    :{label:'SELL ZONE / AVOID',color:'var(--red)'};
  if(breakout&&score>=60)verdict={label:'BREAKOUT — MOMENTUM BUY',color:'var(--lime)'};
  if(broken&&score<45)verdict={label:'SUPPORT BROKEN — EXIT/AVOID',color:'var(--red)'};

  var buyAt=tl.sup?tl.sup.now:price-1.5*atr;
  var target=tl.res?Math.max(tl.res.now,price+2*atr):price+2*atr;
  var stop=Math.min(buyAt*0.985,price-1.5*atr);
  return{score:score,verdict:verdict,reasons:reasons.slice(0,5),structure:st,macd:macd,pressure:press,
    rsi:rsi,lines:tl,breakout:breakout,broken:broken,
    levels:{buyAt:buyAt,breakout:tl.res?tl.res.now*1.01:null,target:target,stop:stop}};
}

// ── Chart: Bollinger Bands ────────────────────────────────────
function calcBB(candles,period,mult){
  period=period||20;mult=mult||2;
  var result=[];
  for(var i=period-1;i<candles.length;i++){
    var slice=candles.slice(i-period+1,i+1);
    var closes=slice.map(function(c){return c.close;});
    var sma=closes.reduce(function(a,b){return a+b;},0)/period;
    var variance=closes.reduce(function(s,c){return s+Math.pow(c-sma,2);},0)/period;
    var sd=Math.sqrt(variance);
    result.push({time:candles[i].time,upper:+(sma+mult*sd).toFixed(6),middle:+sma.toFixed(6),lower:+(sma-mult*sd).toFixed(6),bw:sd/sma*100});
  }
  return result;
}

// ── RSI (14-period Wilder smoothing) ─────────────────────────
function calcRSI(candles,period){
  period=period||14;
  if(candles.length<period+1)return[];
  var result=[];
  var gains=0,losses=0;
  for(var i=1;i<=period;i++){
    var d=candles[i].close-candles[i-1].close;
    if(d>0)gains+=d;else losses-=d;
  }
  gains/=period;losses/=period;
  for(var i=period;i<candles.length;i++){
    if(i>period){
      var d=candles[i].close-candles[i-1].close;
      if(d>0){gains=(gains*(period-1)+d)/period;losses=(losses*(period-1))/period;}
      else{gains=(gains*(period-1))/period;losses=(losses*(period-1)-d)/period;}
    }
    var rs=losses===0?100:gains/losses;
    result.push({time:candles[i].time,value:parseFloat((100-(100/(1+rs))).toFixed(2))});
  }
  return result;
}

// ── ATR (14-period) for stop loss/take profit ─────────────────
function calcATR(candles,period){
  period=period||14;
  if(candles.length<period+1)return 0;
  var trs=[];
  for(var i=1;i<candles.length;i++){
    var hl=candles[i].high-candles[i].low;
    var hc=Math.abs(candles[i].high-candles[i-1].close);
    var lc=Math.abs(candles[i].low-candles[i-1].close);
    trs.push(Math.max(hl,hc,lc));
  }
  var atr=trs.slice(0,period).reduce(function(a,b){return a+b;},0)/period;
  for(var i=period;i<trs.length;i++)atr=(atr*(period-1)+trs[i])/period;
  return atr;
}

// ── Multi-indicator confluence signals (BB + RSI) ─────────────
function calcSignals(candles,bb,rsi){
  var bbOff=candles.length-bb.length;
  var rsiOff=rsi?candles.length-rsi.length:candles.length;
  var sigs=[];
  for(var i=1;i<bb.length;i++){
    var ci=i+bbOff;
    var c=candles[ci],p=candles[ci-1];
    var b=bb[i],pb=bb[i-1];
    var rsiVal=rsi&&i>=rsiOff-bbOff?rsi[i-(rsiOff-bbOff)]?rsi[i-(rsiOff-bbOff)].value:50:50;
    var score=0;
    var isBuyBB=(p.close<=pb.lower&&c.close>b.lower)||(c.low<b.lower&&c.close>b.lower);
    var isSellBB=(p.close>=pb.upper&&c.close<b.upper)||(c.high>b.upper&&c.close<b.upper);
    if(isBuyBB)score+=3;
    if(isSellBB)score-=3;
    if(rsiVal<35)score+=2;else if(rsiVal<45)score+=1;
    if(rsiVal>65)score-=2;else if(rsiVal>55)score-=1;
    // Momentum: compare close to 3 candles ago
    if(ci>=3){var mom=(c.close-candles[ci-3].close)/candles[ci-3].close;if(mom>0.015)score++;if(mom<-0.015)score--;}
    if(score>=4){
      var label=score>=5?'STRONG BUY':'BUY';
      sigs.push({time:c.time,type:'buy',score:score,color:score>=5?'#c8f135':'#4ade80',shape:score>=5?'arrowUp':'arrowUp',text:label,price:c.low,rsi:rsiVal});
    } else if(score<=-4){
      var label=score<=-5?'STRONG SELL':'SELL';
      sigs.push({time:c.time,type:'sell',score:score,color:score<=-5?'#f87171':'#e05555',shape:'arrowDown',text:label,price:c.high,rsi:rsiVal});
    }
  }
  return sigs;
}

// ── Backtester ────────────────────────────────────────────────
function backtest(candles,sigs){
  if(!sigs.length||!candles.length)return null;
  var STAKE=10000;var cash=STAKE;var pos=0;var entry=0;
  var trades=[];var peak=STAKE;var maxDD=0;
  sigs.forEach(function(sig){
    var c=candles.find(function(x){return x.time===sig.time;});
    if(!c)return;
    if(sig.type==='buy'&&!pos){
      entry=c.close;pos=cash/entry;cash=0;
    } else if(sig.type==='sell'&&pos){
      var exit=c.close;
      var pnl=(exit-entry)/entry*100;
      var gross=pos*exit;
      trades.push({entry:entry,exit:exit,pnl:pnl,gross:gross});
      cash=gross;pos=0;
      if(cash>peak)peak=cash;
      var dd=(peak-cash)/peak*100;
      if(dd>maxDD)maxDD=dd;
    }
  });
  // Close open position at last price
  if(pos){
    var lp=candles[candles.length-1].close;
    var pnl=(lp-entry)/entry*100;
    trades.push({entry:entry,exit:lp,pnl:pnl,gross:pos*lp,open:true});
    cash=pos*lp;
  }
  if(!trades.length)return null;
  var wins=trades.filter(function(t){return t.pnl>0;});
  var losses=trades.filter(function(t){return t.pnl<=0;});
  var avgWin=wins.length?wins.reduce(function(s,t){return s+t.pnl;},0)/wins.length:0;
  var avgLoss=losses.length?losses.reduce(function(s,t){return s+t.pnl;},0)/losses.length:0;
  var totalReturn=(cash-STAKE)/STAKE*100;
  var pf=losses.length&&avgLoss!==0?Math.abs(avgWin*wins.length/(avgLoss*losses.length)):99;
  return{trades:trades,wins:wins.length,losses:losses.length,winRate:trades.length?(wins.length/trades.length*100):0,avgWin:avgWin,avgLoss:avgLoss,totalReturn:totalReturn,maxDD:maxDD,profitFactor:pf,finalCash:cash};
}

// ── Chart: Education panel ────────────────────────────────────
function bbEducation(candles,bb,sigs,rsi,atr,bt){

  html+='</div></div>';
  return html;
}

  if(!isStockAsset)wl.forEach(function(w){var t=String(w.ticker).toUpperCase();if(t!==chartAsset&&compTicks.indexOf(t)<0&&!port.stocks.some(function(s){return s.ticker===t;}))compTicks.push(t);});
  if(chartCompare&&(chartCompare===chartAsset||compTicks.indexOf(chartCompare)<0))chartCompare='';
  if(compTicks.length){
    html+='<select class="asset-sel" id="chartCmpSel" onchange="chartCompare=this.value;loadChart()" style="max-width:120px">';
    html+='<option value=""'+(chartCompare?'':' selected')+'>vs — none</option>';
    compTicks.forEach(function(t){html+='<option value="'+t+'"'+(t===chartCompare?' selected':'')+'>vs '+t+'</option>';});
    html+='</select>';
  }
  html+='<span style="font-size:10px;color:var(--t3);margin-left:4px">BB(20,2) · <span style="color:#4a9eff">EMA20</span> <span style="color:#a855f7">EMA50</span> <span style="color:#e0894a">EMA200</span> · <span style="color:#4ade80">Buyers\' line</span> <span style="color:#e05555">Sellers\' line</span></span>';
  html+='</div>';
  html+='<div id="quickRead"></div>';
  html+='<div class="chart-wrap"><div id="chartContainer" style="height:360px"></div><div id="rsiContainer" style="height:100px;margin-top:1px;background:#0d0d0d;border-top:1px solid #1a1a1a"></div></div>';
  html+='<div id="cmpNote"></div>';

  html+='<div class="sh gold">Education — What The Chart Is Telling You</div>';
  html+='<div id="eduPanel"><div class="loading-chart"><span class="dot" style="color:var(--gold)">●</span> Loading chart data...</div></div>';

}

async function loadChart(){
  var el=document.getElementById('chartContainer');
  if(!el)return;
  el.innerHTML='<div class="loading-chart"><span class="dot" style="color:var(--gold)">●</span> Fetching price data...</div>';
  if(document.getElementById('sigPanel'))document.getElementById('sigPanel').innerHTML='';
  if(document.getElementById('eduPanel'))document.getElementById('eduPanel').innerHTML='<div class="loading-chart"><span class="dot" style="color:var(--gold)">●</span> Analyzing...</div>';

  var candles=await fetchOHLC(chartAsset,chartDays);
  if(!candles||!candles.length){
    el.innerHTML='<div class="loading-chart">No price data found for '+chartAsset+'.<br>Check your Alpha Vantage key for stocks.</div>';
    return;
  }

  var bb=calcBB(candles,20,2);
  var rsi=calcRSI(candles,14);
  var atr=calcATR(candles,14);
  var sigs=calcSignals(candles,bb,rsi);
  var bt=backtest(candles,sigs);
  var last=candles[candles.length-1];
  var lastBB=bb[bb.length-1];

  // Quick Read — instant, pure math (no AI round-trip)
  var read=tradeRead(candles);
  var qr=document.getElementById('quickRead');
  if(qr)qr.innerHTML=read?quickReadHtml(read,last.close):'';

  // Clear & create chart
  el.innerHTML='';
  if(chartInst){try{chartInst.remove();}catch(e){}chartInst=null;}
  chartInst=LightweightCharts.createChart(el,{
    width:el.clientWidth,height:400,
    layout:{background:{color:'#0d0d0d'},textColor:'#888'},
    grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}},
    crosshair:{mode:1},
    rightPriceScale:{borderColor:'#1a1a1a'},
    timeScale:{borderColor:'#1a1a1a',timeVisible:true,secondsVisible:false}
  });

  // Candlesticks
  var cSeries=chartInst.addCandlestickSeries({
    upColor:'#4ade80',downColor:'#e05555',
    borderUpColor:'#4ade80',borderDownColor:'#e05555',
    wickUpColor:'#4ade80',wickDownColor:'#e05555'
  });
  cSeries.setData(candles);

  // Bollinger Bands
  if(bb.length){
    var upperS=chartInst.addLineSeries({color:'rgba(201,168,76,0.6)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    var midS=chartInst.addLineSeries({color:'rgba(136,136,136,0.5)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
    var lowerS=chartInst.addLineSeries({color:'rgba(201,168,76,0.6)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    upperS.setData(bb.map(function(b){return{time:b.time,value:b.upper};}));
    midS.setData(bb.map(function(b){return{time:b.time,value:b.middle};}));
    lowerS.setData(bb.map(function(b){return{time:b.time,value:b.lower};}));
  }

  // EMA overlays (20 / 50 / 200 — drawn only when enough candles exist)
  [[20,'#4a9eff'],[50,'#a855f7'],[200,'#e0894a']].forEach(function(ec){
    var e=calcEMA(candles,ec[0]);
    if(e.length>1){
      var es=chartInst.addLineSeries({color:ec[1],lineWidth:1,priceLineVisible:false,lastValueVisible:false});
      es.setData(e);
    }
  });

  // Buyers' (support) & sellers' (resistance) trend lines — auto-fitted through swing pivots
  if(read&&read.lines){
    var lastIdx=candles.length-1;
    [['sup','#4ade80'],['res','#e05555']].forEach(function(tc){
      var ln=read.lines[tc[0]];
      if(!ln)return;
      var p0=ln.m*ln.i0+ln.b,p1=ln.m*lastIdx+ln.b;
      if(p0<=0||p1<=0)return;
      var ts=chartInst.addLineSeries({color:tc[1],lineWidth:2,lineStyle:0,priceLineVisible:false,lastValueVisible:true});
      ts.setData([{time:candles[ln.i0].time,value:+p0.toFixed(6)},{time:candles[lastIdx].time,value:+p1.toFixed(6)}]);
    });
  }

  // Compare overlay — second asset as normalized % change on a hidden scale
  var cmpEl=document.getElementById('cmpNote');
  if(cmpEl)cmpEl.innerHTML='';
  if(chartCompare&&chartCompare!==chartAsset){
    try{
      var cc=await fetchOHLC(chartCompare,chartDays);
      if(cc&&cc.length>1){
        var base=cc[0].close;
        var cmpS=chartInst.addLineSeries({color:'#c8f135',lineWidth:2,priceScaleId:'cmp',priceLineVisible:false,lastValueVisible:false});
        cmpS.setData(cc.map(function(c){return{time:c.time,value:+((c.close/base-1)*100).toFixed(2)};}));
        try{chartInst.priceScale('cmp').applyOptions({visible:false});}catch(e){}
        var aPct=(candles[candles.length-1].close/candles[0].close-1)*100;
        var bPct=(cc[cc.length-1].close/base-1)*100;
        if(cmpEl)cmpEl.innerHTML='<div style="font-size:11px;color:var(--t2);margin:8px 2px 0">Performance over '+chartDays+'D: <b style="color:var(--t)">'+chartAsset+'</b> <span style="color:'+(aPct>=0?'var(--grn)':'var(--red)')+'">'+fpc(aPct)+'</span> vs <b style="color:#c8f135">'+chartCompare+'</b> <span style="color:'+(bPct>=0?'var(--grn)':'var(--red)')+'">'+fpc(bPct)+'</span> <span style="color:var(--t3)">(lime line, normalized)</span></div>';
      } else if(cmpEl){cmpEl.innerHTML='<div style="font-size:11px;color:var(--t3);margin:8px 2px 0">Couldn\'t load '+chartCompare+' history for compare (rate limit) — try again in a minute.</div>';}
    }catch(e){}
  }

  // Buy/sell markers
  if(sigs.length){
    cSeries.setMarkers(sigs.map(function(s){
      return{time:s.time,position:s.type==='sell'?'aboveBar':'belowBar',color:s.color,shape:s.type==='sell'?'arrowDown':s.type==='bounce'?'circle':'arrowUp',text:s.text};
    }));
  }

  chartInst.timeScale().fitContent();

  // RSI pane
  var rsiEl=document.getElementById('rsiContainer');
  if(rsiEl&&rsi.length){
    rsiEl.innerHTML='';
    if(window._rsiInst){try{window._rsiInst.remove();}catch(e){} window._rsiInst=null;}
    window._rsiInst=LightweightCharts.createChart(rsiEl,{
      width:rsiEl.clientWidth,height:100,
      layout:{background:{color:'#0d0d0d'},textColor:'#666'},
      grid:{vertLines:{color:'#1a1a1a'},horzLines:{color:'#1a1a1a'}},
      rightPriceScale:{borderColor:'#1a1a1a',scaleMargins:{top:0.1,bottom:0.1}},
      timeScale:{borderColor:'#1a1a1a',timeVisible:true,secondsVisible:false},
      crosshair:{mode:1}
    });
    var rsiS=window._rsiInst.addLineSeries({color:'#a855f7',lineWidth:1.5,priceLineVisible:false,lastValueVisible:true});
    rsiS.setData(rsi);
    var obS=window._rsiInst.addLineSeries({color:'rgba(224,85,85,0.35)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
    obS.setData(rsi.map(function(r){return{time:r.time,value:70};}));
    var osS=window._rsiInst.addLineSeries({color:'rgba(74,222,128,0.35)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
    osS.setData(rsi.map(function(r){return{time:r.time,value:30};}));
    window._rsiInst.timeScale().fitContent();
    chartInst.timeScale().subscribeVisibleTimeRangeChange(function(range){
      if(window._rsiInst)try{window._rsiInst.timeScale().setVisibleRange(range);}catch(e){}
    });
    if(window._rsiResizer)window._rsiResizer.disconnect();
    window._rsiResizer=new ResizeObserver(function(){if(window._rsiInst)window._rsiInst.applyOptions({width:rsiEl.clientWidth});});
    window._rsiResizer.observe(rsiEl);
  }

  // Resize observer (main)
  if(window._chartResizer)window._chartResizer.disconnect();
  window._chartResizer=new ResizeObserver(function(){if(chartInst)chartInst.applyOptions({width:el.clientWidth});});
  window._chartResizer.observe(el);

  // Signal panel
  var sp=document.getElementById('sigPanel');
  if(sp&&lastBB){
    var price=last.close;
    var pct=((price-lastBB.lower)/(lastBB.upper-lastBB.lower)*100).toFixed(0);
    var buys=sigs.filter(function(s){return s.type==='buy';}).length;
    var sells=sigs.filter(function(s){return s.type==='sell';}).length;
    var lastRsi=rsi.length?rsi[rsi.length-1].value:50;
    var rsiColor=lastRsi>70?'var(--red)':lastRsi<30?'var(--grn)':'var(--pur)';
    var rsiLabel=lastRsi>70?'Overbought':lastRsi<30?'Oversold':'Neutral';
    sp.innerHTML=
      '<div class="sig-card" style="border-left:2px solid var(--gold)"><div class="sig-card-lbl">Band Position</div><div class="sig-card-val" style="color:var(--gold)">'+pct+'%</div><div class="sig-card-sub">0%=lower · 100%=upper</div></div>'+
      '<div class="sig-card" style="border-left:2px solid var(--pur)"><div class="sig-card-lbl">RSI (14)</div><div class="sig-card-val" style="color:'+rsiColor+'">'+lastRsi.toFixed(1)+'</div><div class="sig-card-sub">'+rsiLabel+'</div></div>'+
      '<div class="sig-card" style="border-left:2px solid var(--grn)"><div class="sig-card-lbl">Buy Signals</div><div class="sig-card-val" style="color:var(--grn)">'+buys+'</div><div class="sig-card-sub">Last '+chartDays+'D</div></div>'+
      '<div class="sig-card" style="border-left:2px solid var(--red)"><div class="sig-card-lbl">Sell Signals</div><div class="sig-card-val" style="color:var(--red)">'+sells+'</div><div class="sig-card-sub">Last '+chartDays+'D</div></div>'+
      (bt?'<div class="sig-card" style="border-left:2px solid var(--lime)"><div class="sig-card-lbl">Win Rate</div><div class="sig-card-val" style="color:var(--lime)">'+bt.winRate.toFixed(0)+'%</div><div class="sig-card-sub">'+bt.wins+'W / '+bt.losses+'L</div></div>'+
          '<div class="sig-card" style="border-left:2px solid var(--ora)"><div class="sig-card-lbl">Profit Factor</div><div class="sig-card-val" style="color:var(--ora)">'+Math.min(bt.profitFactor,99).toFixed(2)+'x</div><div class="sig-card-sub">'+bt.totalReturn.toFixed(1)+'% total</div></div>':'');
  }

  // Education
  var ep=document.getElementById('eduPanel');
  if(ep)ep.innerHTML=bbEducation(candles,bb,sigs,rsi,atr,bt);
}

// Inline edit of an existing holding's quantity / avg-buy — no delete-and-re-add.
// Inputs use classes (not ids) so desktop table + mobile card copies never collide;
// we always read/focus the currently VISIBLE one.
var editHoldId=null;
function _ehVal(cls){var els=document.querySelectorAll('.'+cls);for(var i=0;i<els.length;i++){if(els[i].offsetParent!==null)return els[i].value;}return els.length?els[0].value:'';}
function startEditHold(type,id){editHoldId=id;render();setTimeout(function(){var els=document.querySelectorAll('.eh-qty');for(var i=0;i<els.length;i++){if(els[i].offsetParent!==null){els[i].focus();els[i].select();break;}}},30);}
function cancelEditHold(){editHoldId=null;render();}
function saveEditHold(type,id){
  var qty=parseFloat(_ehVal('eh-qty')),avg=parseFloat(_ehVal('eh-avg'));
  var list=type==='crypto'?port.crypto:port.stocks;
  var h=list.find(function(x){return x.id===id;});
  if(!h){editHoldId=null;render();return;}
  if(!isNaN(qty)&&qty>0)h.qty=qty;
  if(!isNaN(avg)&&avg>=0)h.avg=avg; // 0 allowed = unknown cost basis
  editHoldId=null;
  savePort();refreshAll();
}

// ── Signals: buy/sell opportunities across your holdings ──────
function _oppScore(rsi,pctB,mom){
  var s=0;
  if(rsi<30)s+=3;else if(rsi<40)s+=2;else if(rsi<45)s+=1;
  if(rsi>70)s-=3;else if(rsi>60)s-=2;else if(rsi>55)s-=1;
  if(pctB<=0.05)s+=2;else if(pctB<0.2)s+=1;
  if(pctB>=0.95)s-=2;else if(pctB>0.8)s-=1;
  if(mom>0.03)s+=1;else if(mom<-0.03)s-=1;

}
function _oppAction(score){
  if(score>=5)return{label:'STRONG BUY',type:'buy',color:'var(--lime)'};
  if(score>=3)return{label:'BUY',type:'buy',color:'var(--grn)'};
  if(score>=1)return{label:'ACCUMULATE',type:'buy',color:'var(--grn)'};
  if(score<=-5)return{label:'SELL',type:'sell',color:'var(--red)'};
  if(score<=-3)return{label:'TRIM',type:'sell',color:'var(--red)'};
  if(score<=-1)return{label:'TAKE SOME',type:'sell',color:'var(--gold)'};
  return{label:'HOLD',type:'hold',color:'var(--t2)'};
}
function _oppRationale(rsi,pctB,pnl){
  var b=[];
  if(rsi<35)b.push('RSI '+Math.round(rsi)+' oversold');
  else if(rsi>65)b.push('RSI '+Math.round(rsi)+' overbought');
  else b.push('RSI '+Math.round(rsi)+' neutral');
  if(pctB<=0.15)b.push('at lower band / support');
  else if(pctB>=0.85)b.push('at upper band / resistance');
  else b.push('mid-range');
  if(pnl<=-10)b.push('you’re down '+Math.abs(Math.round(pnl))+'%');
  else if(pnl>=25)b.push('up '+Math.round(pnl)+'% — protect gains');
  return b.join(' · ');
}

// ── 5-year projection engine (pure math, instant) ─────────────
// Scenario CAGRs by asset class — deliberately conservative vs raw history,
// because last cycle's return compounded 5 years is fantasy. Shown as assumptions.
var SCENARIO_RATES={
  major:{bear:-0.15,base:0.20,bull:0.45},  // BTC & ETH
  alt:{bear:-0.30,base:0.15,bull:0.60},    // other crypto
  stock:{bear:-0.02,base:0.08,bull:0.14}   // equities
};
function _rateClass(h){
  if(port.stocks.some(function(s){return s.id===h.id;}))return'stock';
  var t=String(h.ticker).toUpperCase();
  return(t==='BTC'||t==='ETH')?'major':'alt';
}
function projectHoldings(){
  var a=all();if(!a.length)return null;
  var rows=a.map(function(h){
    var v=pof(h)*h.qty,rc=_rateClass(h),r=SCENARIO_RATES[rc];
    return{ticker:h.ticker,name:h.name,cls:rc,now:v,
      bear:v*Math.pow(1+r.bear,5),base:v*Math.pow(1+r.base,5),bull:v*Math.pow(1+r.bull,5)};
  }).sort(function(x,y){return y.now-x.now;});
  var monthly=goal&&goal.monthly?goal.monthly:0;
  function path(key){
    var hs=a.map(function(h){return{v:pof(h)*h.qty,r:SCENARIO_RATES[_rateClass(h)][key]};});
    var tot0=hs.reduce(function(s,x){return s+x.v;},0)||1;
    var blend=hs.reduce(function(s,x){return s+x.r*x.v;},0)/tot0;
    var pool=0,vals=[];
    for(var y=1;y<=5;y++){
      hs=hs.map(function(x){return{v:x.v*(1+x.r),r:x.r};});
      pool=pool*(1+blend)+monthly*12;
      vals.push(hs.reduce(function(s,x){return s+x.v;},0)+pool);
    }
    return vals;
  }
  var out={rows:rows,paths:{bear:path('bear'),base:path('base'),bull:path('bull')},monthly:monthly};
  if(goal&&goal.target){
    out.hitYear={};
    ['bear','base','bull'].forEach(function(k){
      var y=null;out.paths[k].some(function(v,i){if(v>=goal.target){y=i+1;return true;}return false;});
      out.hitYear[k]=y;
    });
  }
  return out;
}

// Ranks the top-50 market by PROVEN record (real 1y/200d/30d returns from

// the "should I move?" judgment is the metered AI step.
var posReview={at:0,rows:[],mine:[],loading:false,error:null,ai:null};
var _POS_EXCLUDE={USDT:1,USDC:1,DAI:1,FDUSD:1,USDE:1,WBTC:1,STETH:1,WSTETH:1,WETH:1,WEETH:1,CBBTC:1};
// Same-origin proxy first (immune to ad blockers + CoinGecko rate limits),
// direct CoinGecko as fallback (keeps local/static previews working).
async function _marketFetch(q){
  try{
    var r=await fetch('/api/market?'+q);
    if(r.ok){var d=await r.json();if(Array.isArray(d)&&d.length)return d;}
  }catch(e){}
  var direct=q==='kind=top50'
    ?'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false&price_change_percentage=30d,200d,1y'
    :'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&'+q+'&sparkline=false&price_change_percentage=30d,200d,1y';
  var r2=await fetch(direct);
  var d2=await r2.json();
  return Array.isArray(d2)?d2:[];
}
async function reviewPositions(){
  posReview.loading=true;posReview.error=null;posReview.ai=null;render();
  try{
    var d=await _marketFetch('kind=top50');
    if(!Array.isArray(d)||!d.length)throw new Error('Market data is unreachable — if you use an ad blocker, allow bullruniq.com and try again.');
    function rec(c){return{ticker:c.symbol.toUpperCase(),name:c.name,rank:c.market_cap_rank,
      r30:c.price_change_percentage_30d_in_currency,r200:c.price_change_percentage_200d_in_currency,r1y:c.price_change_percentage_1y_in_currency};}
    var have={};
    var rows=d.map(rec).filter(function(x){return !_POS_EXCLUDE[x.ticker];});
    rows.forEach(function(x){
      have[x.ticker]=x;
      var ok=x.r1y!=null&&x.r200!=null&&x.r30!=null;
      x.consistent=ok&&x.r1y>0&&x.r200>0&&x.r30>0;
      x.score=ok?x.r1y*0.5+x.r200*0.3+x.r30*0.2:-1e9;
    });
    // records for held coins outside the top 50
    var myTicks=port.crypto.map(function(h){return h.ticker.toUpperCase();});
    var missing=myTicks.filter(function(t){return !have[t];});
    if(missing.length){
      try{
        var ids=missing.map(function(t){return CGMAP[t]||t.toLowerCase();}).join(',');
        var d2=await _marketFetch('ids='+encodeURIComponent(ids));
        d2.map(rec).forEach(function(x){have[x.ticker]=x;});
      }catch(e){}
    }
    posReview.mine=myTicks.map(function(t){return have[t]||{ticker:t,name:t,r30:null,r200:null,r1y:null};});
    posReview.rows=rows.sort(function(a,b){return b.score-a.score;}).slice(0,8)
      .map(function(x){x.held=myTicks.indexOf(x.ticker)>-1;return x;});
    posReview.at=Date.now();
    track('positions_reviewed');
  }catch(e){posReview.error=e.message;}
  posReview.loading=false;render();
}
async function runPosReviewAI(){

// Every actionable AI call (Signals verdicts, Council positions) is logged with
// its exact levels, then graded against real exchange candles. Wins AND losses.
function _num(s){var n=parseFloat(String(s).replace(/[$,\s]/g,''));return isFinite(n)&&n>0?n:null;}
function recordCall(src,ticker,side,entry,target,stop,note){
  if(isDemo())return; // never pollute the record with demo data
  if(!ticker||!entry||!target||!stop)return;
  if(side==='buy'&&!(target>entry&&stop<entry))return;  // levels must make sense
  if(side==='sell'&&!(target<entry&&stop>entry))return;
  var dup=calls.find(function(c){return c.status==='open'&&c.ticker===ticker&&c.src===src&&c.side===side;});
  if(dup)return;
  calls.unshift({id:Date.now()+Math.random(),src:src,ticker:ticker,side:side,
    entry:+entry,target:+target,stop:+stop,note:note||'',at:Date.now(),status:'open'});
  calls=calls.slice(0,200);
  saveCalls();
}
function _candleMs(k){return typeof k.time==='number'?k.time*1000:new Date(k.time).getTime();}
async function gradeCalls(force){
  var now=Date.now();
  if(!force&&now-(window._gradedAt||0)<3600000)return;
  window._gradedAt=now;
  var open=calls.filter(function(c){return c.status==='open'&&now-c.at>6*3600000;});
  if(!open.length)return;
  var byTicker={};open.forEach(function(c){(byTicker[c.ticker]=byTicker[c.ticker]||[]).push(c);});
  var ticks=Object.keys(byTicker);var changed=false;
  for(var i=0;i<ticks.length;i++){
    var cs=await fetchOHLC(ticks[i],180);
    if(cs&&cs.length){
      byTicker[ticks[i]].forEach(function(c){
        var after=cs.filter(function(k){return _candleMs(k)>=c.at;});
        var res=null;
        for(var j=0;j<after.length;j++){
          var hi=after[j].high,lo=after[j].low;
          var hitT=c.side==='buy'?hi>=c.target:lo<=c.target;
          var hitS=c.side==='buy'?lo<=c.stop:hi>=c.stop;
          if(hitT&&hitS){res='loss';break;}   // both in one candle → conservative: count the loss
          if(hitT){res='win';break;}
          if(hitS){res='loss';break;}
        }
        if(!res&&now-c.at>72*3600000&&after.length){
          var lastC=after[after.length-1].close;c.exitPrice=lastC;
          res=(c.side==='buy'?lastC>c.entry:lastC<c.entry)?'expired_win':'expired_loss';
        }
        if(res){
          c.status=res;c.gradedAt=now;
          var risk=Math.abs(c.entry-c.stop)||1;
          var exit=res==='win'?c.target:res==='loss'?c.stop:c.exitPrice;
          c.r=+(((c.side==='buy'?exit-c.entry:c.entry-exit))/risk).toFixed(2);
          changed=true;
        }
      });
    }
    if(i<ticks.length-1)await sleep(1500);
  }
  if(changed){saveCalls();if(tab==='record')render();}
}
function recordStats(list){
  var graded=list.filter(function(c){return c.status!=='open';});
  var wins=graded.filter(function(c){return c.status==='win'||c.status==='expired_win';});
  var tHit=graded.filter(function(c){return c.status==='win';});
  var rs=graded.filter(function(c){return typeof c.r==='number';});
  return{total:list.length,open:list.length-graded.length,graded:graded.length,wins:wins.length,
    winRate:graded.length?Math.round(wins.length/graded.length*100):null,
    targetHit:graded.length?Math.round(tHit.length/graded.length*100):null,
    avgR:rs.length?+(rs.reduce(function(s,c){return s+c.r;},0)/rs.length).toFixed(2):null};
}
