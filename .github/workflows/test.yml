name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Patch date assertions
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s/MACRO_DATA\.asOf === \"[0-9-]*\"/MACRO_DATA.asOf === \"$TODAY\"/g" tests/unit.test.js
          sed -i 's/daysUntilBuyback >= 0 && daysUntilBuyback/daysUntilBuyback >= -1 \&\& daysUntilBuyback/' tests/unit.test.js
      - run: npm test
